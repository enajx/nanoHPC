[project]
name = "nanohpc"
version = "0.0.1"
description = "Slurm cluster with monitoring and a user website for small lab clusters, from one configuration file."
readme = "PROJECT.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ansible-core>=2.21.4",
    "pyyaml>=6",
    "ruamel-yaml>=0.19.1",
    "textual>=8.2.8",
]

[project.scripts]
nanohpc = "nanohpc.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.build-backend]
# The website source ships in the package (cluster.yml can build the site on the front node), but not its
# local npm install or test output. source-exclude also applies to the wheel.
source-exclude = ["node_modules", "test-results", "playwright-report"]
