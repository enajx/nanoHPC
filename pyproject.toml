[project]
name = "nanohpc"
version = "0.0.1"
description = "Slurm cluster with monitoring and a user website for small lab clusters, from one configuration file."
readme = "PROJECT.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.scripts]
nanohpc = "nanohpc.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pyrefly>=1.3.2",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
