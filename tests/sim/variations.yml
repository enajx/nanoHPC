# Simulated test cluster: test-only file, never used on a real cluster (see md/testing.md).
# The small cluster on Ubuntu 24.04 with the less common settings: /home on the root disk (no home.device),
# an own website certificate, the website on the whole hostname, a logo, and the website built on the front node.
cluster: cluster-small-roothome.yml
ubuntu: "24.04"
fake_gpus: [gpu4]
vms:
  default: {cpus: 1, memory_gb: 1, disk_gb: 10}
  front: {cpus: 2, memory_gb: 3, disk_gb: 20}   # runs MariaDB, builds the website
extra_disk_gb: 10
