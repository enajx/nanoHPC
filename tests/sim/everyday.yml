# Simulated test cluster: test-only file, never used on a real cluster (see md/testing.md).
# Everyday cluster with /home on the front node and the backup going to the storage machine.
cluster: ../../examples/cluster.yml   # path relative to this file
ubuntu: "24.04"
fake_gpus: [gpu4, gpu2, gpu4i]        # machines whose GPUs are simulated
vms:
  default: {cpus: 1, memory_gb: 1, disk_gb: 10}
  front: {cpus: 2, memory_gb: 3, disk_gb: 20}   # builds Slurm, runs MariaDB
extra_disk_gb: 10                     # size of each extra disk (home.device, scratch.device)
