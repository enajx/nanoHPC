# Three machines for SimLoginNodeTest: a front node with /home, a compute machine, and a login node that keeps its
# own /home (home_mount: own).
cluster:
  name: logintest
  admins: [alice]
  website:
    hostname: cluster.example.org
    https: letsencrypt
    login_address: cluster.example.org
machines:
  front:
    address: 192.168.104.10
    aliases: [cluster.example.org]
    roles: [front, home]
    home:
      device: /dev/vdb
  cpu1:
    address: 192.168.104.11
    roles: [compute]
    cpu: {sockets: 1, cores_per_socket: 2, threads_per_core: 1}
    memory_mb: 2048
    partitions: [main]
    scratch: {image_gb: 2}
  login1:
    address: 192.168.104.12
    roles: [login]
    home_mount: own
users:
  - name: alice
    uid: 2000
    ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceWithYourOwnPublicKey alice@laptop"]
partitions:
  main:
    default: true
    jobs: batch
    max_time: "01:00:00"
policy:
  default_memory_mb_per_cpu: 1024
