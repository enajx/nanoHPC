# Simulated large test cluster: a front node and 20 compute nodes of mixed kinds.
# Checks that configuration, Slurm, dashboards, and the website handle more machines.

cluster:
  name: labcluster
  admins: [alice]
  website:
    hostname: cluster.example.org
    https: letsencrypt

machines:
