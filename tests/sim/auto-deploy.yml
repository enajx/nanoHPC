# Simulated test cluster: test-only file, never used on a real cluster (see md/testing.md).
# The small cluster on Ubuntu 24.04, to check automatic deploys from a configuration repository.
cluster: cluster-auto.yml   # its own name, so it can run next to the other test clusters
ubuntu: "24.04"
fake_gpus: [gpu4]
vms:
  default: {cpus: 1, memory_gb: 1, disk_gb: 10}
  front: {cpus: 2, memory_gb: 3, disk_gb: 20}   # runs MariaDB and the automatic deploys
extra_disk_gb: 10
