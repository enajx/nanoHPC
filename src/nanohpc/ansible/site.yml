# nanoHPC deploy playbook. `nanohpc deploy` generates the inventory, the `nanohpc` variables,
# and the configuration files, then runs this playbook. Machines that fail a check are dropped
# from the rest of the run without further changes; the others continue.
#
# Every deploy runs it twice. First in check mode, the dry run (`--check`): it changes nothing on the machines
# except refreshing apt's package lists, and writes only temporary files in /tmp to check new configuration
# files with their own checkers (the dry_run_check role). Then for real, on the machines whose dry run passed:
# the others are left out, unchanged (nanohpc_left_out). If the front node, home machine, or configured
# shared datasets server fails its dry run, nanohpc deploy deploys nothing, since other machines depend on them.
# Read-only commands whose output later tasks use also run in the dry run (`check_mode: false` with
# `changed_when: false`). A task that only makes sense after an earlier change is skipped in the dry run while
# that change is still to be made (`ansible_check_mode and ...`), so a first deploy of a new machine can only be
# partly previewed. The preflight checks always run in full.
# Variables from nanohpc deploy: nanohpc_left_out (machines left out of this run) and nanohpc_dry_run (per
# machine, the nanohpc_dry_run_* facts the dry run read, for the real run to compare).

- name: Check every machine before changing anything
  hosts: all
  become: true
  pre_tasks:
    # Facts are gathered first, so the other machines can still read this machine's facts (host keys).
    - name: Leave out the machines whose dry run failed (nothing is changed on them)
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} is left out of this deploy: its dry run failed"
      when: inventory_hostname in nanohpc_left_out
  roles: [preflight]

# A removed shared role needs manual teardown. Stop before the base role replaces the
# recorded roles, or an old /shared export or mount could silently remain in service.
- name: Refuse stale shared datasets configuration
  hosts: all
  become: true
  any_errors_fatal: true
  vars:
    shared_server_here: "{{ nanohpc.shared is not none and inventory_hostname == nanohpc.shared.server }}"
    shared_client_here: "{{ nanohpc.shared is not none and inventory_hostname in nanohpc.shared.clients }}"
  tasks:
    - name: Look for the old shared datasets export
      ansible.builtin.stat:
        path: /etc/exports.d/nanohpc-shared.exports
      register: shared_old_export

    - name: Look for the old NFS mount requirement
      ansible.builtin.stat:
        path: /etc/systemd/system/nfs-server.service.d/nanohpc-shared.conf
      register: shared_old_nfs_unit

    - name: Look for the old shared datasets client marker
      ansible.builtin.stat:
        path: /etc/nanohpc/shared-datasets
      register: shared_old_client

    - name: Look for the machine's recorded roles
      ansible.builtin.stat:
        path: /etc/nanohpc/roles
      register: shared_old_roles_file

    - name: Read the machine's recorded roles
      ansible.builtin.slurp:
        src: /etc/nanohpc/roles
      register: shared_old_roles
      when: shared_old_roles_file.stat.exists

    - name: Read any old /shared server fstab entry
      ansible.builtin.command:
        argv: [awk, '$2 == "/shared" { print }', /etc/fstab]
      register: shared_old_server_fstab
      changed_when: false
      check_mode: false

    - name: Read any old /shared/datasets client fstab entry
      ansible.builtin.command:
        argv: [awk, '$2 == "/shared/datasets" { print }', /etc/fstab]
      register: shared_old_client_fstab
      changed_when: false
      check_mode: false

    - name: Read any old /shared server mount
      ansible.builtin.command: findmnt -n -o SOURCE --mountpoint /shared
      register: shared_old_server_mount
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Read any old /shared/datasets client mount
      ansible.builtin.command: findmnt -n -o SOURCE --mountpoint /shared/datasets
      register: shared_old_client_mount
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Stop if a removed shared role still has setup on this machine
      ansible.builtin.assert:
        that:
          - shared_server_here | bool or not shared_old_export.stat.exists
          - shared_server_here | bool or not shared_old_nfs_unit.stat.exists
          - shared_client_here | bool or not shared_old_client.stat.exists
          - shared_server_here | bool or not (was_shared_server | bool) or (shared_old_server_fstab.stdout | trim == '' and shared_old_server_mount.stdout | trim == '')
          - shared_client_here | bool or (shared_old_client_fstab.stdout | trim == '' and shared_old_client_mount.stdout | trim == '')
        fail_msg: >-
          {{ inventory_hostname }} still has shared datasets setup for a role no longer in cluster.yml.
          Export: {{ shared_old_export.stat.exists }}; NFS mount requirement: {{ shared_old_nfs_unit.stat.exists }};
          client marker: {{ shared_old_client.stat.exists }};
          /shared in fstab: {{ shared_old_server_fstab.stdout | trim | default('none', true) }};
          current /shared mount: {{ shared_old_server_mount.stdout | trim | default('none', true) }};
          /shared/datasets in fstab: {{ shared_old_client_fstab.stdout | trim | default('none', true) }};
          current /shared/datasets mount: {{ shared_old_client_mount.stdout | trim | default('none', true) }}.
          Preserve any datasets, then remove the old export, NFS unit override, client marker, fstab entry,
          and mount that belong to the removed role. Run deploy again after that manual teardown.
        quiet: true
      vars:
        was_shared_server: "{{ 'shared' in ((shared_old_roles.content | default('') | b64decode).split()) }}"

# Automatic deploys: a manual deploy pauses them; the front node's own key, which every machine accepts for
# root from the front node only. A failure here stops the whole run (nothing is changed yet).
- name: Automatic deploy key on the front node
  hosts: role_front
  become: true
  any_errors_fatal: true
  tasks:
    - name: Pause automatic deploys while this manual deploy runs
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: pause
      when: not nanohpc.automatic

    - name: Make or read the key
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: key
      when: nanohpc.auto_deploy.enabled

- name: Base setup, users, and SSH access
  hosts: all
  become: true
  roles: [base, accounts]

- name: /home with quotas on the home machine
  hosts: role_home
  become: true
  roles: [home_server]

- name: The shared /home on the other machines (not the backup machine)
  hosts: all:!role_home:!role_backup
  become: true
  roles: [home_client]

- name: Shared datasets on the storage machine
  hosts: role_shared
  become: true
  roles:
    - role: shared_server
      when: nanohpc.shared is not none

- name: Read-only shared datasets on the compute machines
  hosts: role_compute
  become: true
  roles:
    - role: shared_client
      when: nanohpc.shared is not none

- name: Munge authentication between Slurm machines
  hosts: role_slurm
  become: true
  roles: [munge]

- name: Build (once per Ubuntu release and CPU type) and install Slurm
  hosts: role_slurm
  become: true
  roles: [slurm_packages]

- name: Slurm controller and accounting on the front node
  hosts: role_front
  become: true
  roles: [slurm_controller]

- name: Slurm on the compute machines
  hosts: role_compute
  become: true
  roles: [slurm_compute]

- name: Local scratch on the compute machines
  hosts: role_compute
  become: true
  roles: [scratch]

- name: Job modes (cluster-submit), uv, and Apptainer on the front node and compute machines
  hosts: role_slurm
  become: true
  roles: [job_modes, uv, apptainer]

- name: Metrics certificates and node exporters on every machine
  hosts: all
  become: true
  roles: [metrics_tls, node_metrics, machine_metrics]

- name: Prometheus, alerts, and Grafana on the front node
  hosts: role_front
  become: true
  roles: [prometheus, alerts, grafana]

- name: Status collector on the front node, home quota reader on the home machine
  hosts: role_front:role_home
  become: true
  roles: [monitoring]

# Nightly /home mirror: the key on the home machine, the receiving account on the backup machine (for a
# backup machine in the cluster), then the timer and a check that the destination accepts the key.
- name: Backup key on the home machine
  hosts: role_home
  become: true
  tasks:
    - name: Make or read the backup key
      ansible.builtin.include_role:
        name: backup
        tasks_from: key
      when: nanohpc.backup is not none

- name: Backup machine receives the mirror
  hosts: role_backup
  become: true
  tasks:
    - name: Set up the receiving account
      ansible.builtin.include_role:
        name: backup
        tasks_from: receive
      when: nanohpc.backup is not none and nanohpc.backup.kind == 'machine'

- name: Nightly backup on the home machine
  hosts: role_home
  become: true
  tasks:
    - name: Schedule the backup
      ansible.builtin.include_role:
        name: backup
        tasks_from: "{{ 'schedule' if nanohpc.backup is not none else 'off' }}"

- name: Test certificate server for the website (simulated clusters only)
  hosts: role_front
  become: true
  roles: [test_acme]

- name: Website on the front node
  hosts: role_front
  become: true
  roles: [website]

- name: Automatic deploys on the front node
  hosts: role_front
  become: true
  tasks:
    - name: Set up or remove automatic deploys
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: "{{ 'main' if nanohpc.auto_deploy.enabled else 'off' }}"

- name: Health checks on every machine
  hosts: all
  become: true
  roles: [health]

# Fails the deploy only for broken services and mounts (see roles/health/tasks/check.yml).
- name: Check that every machine works
  hosts: all
  become: true
  tasks:
    - name: Run cluster-health
      ansible.builtin.import_role:
        name: health
        tasks_from: check
