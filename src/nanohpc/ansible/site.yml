# nanoHPC deploy playbook. `nanohpc deploy` generates the inventory, the `nanohpc` variables,
# and the configuration files, then runs this playbook. Machines that fail a check are dropped
# from the rest of the run without further changes; the others continue.
#
# Every deploy runs it twice: first in check mode (the dry run, `--check`: nothing changes), then for real
# only if the dry run passed on every machine. Read-only commands whose output later tasks use also run in
# the dry run (`check_mode: false` with `changed_when: false`). A task that only makes sense after an earlier
# change is skipped in the dry run while that change is still to be made (`ansible_check_mode and ...`), so a
# first deploy of a new machine can only be partly previewed. The preflight checks always run in full.

- name: Check every machine before changing anything
  hosts: all
  become: true
  roles: [preflight]

# Automatic deploys: a manual deploy pauses them; the front node's own key, which every machine accepts for
# root from the front node only.
- name: Automatic deploy key on the front node
  hosts: role_front
  become: true
  tasks:
    - name: Pause automatic deploys while this manual deploy runs
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: pause
      when: not nanohpc.automatic

    - name: Make or read the key
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: key
      when: nanohpc.auto_deploy.enabled

- name: Base setup, users, and SSH access
  hosts: all
  become: true
  roles: [base, accounts]

- name: /home with quotas on the home machine
  hosts: role_home
  become: true
  roles: [home_server]

- name: The shared /home on the other machines (not the backup machine)
  hosts: all:!role_home:!role_backup
  become: true
  roles: [home_client]

- name: Munge authentication between Slurm machines
  hosts: role_slurm
  become: true
  roles: [munge]

- name: Build (once per Ubuntu release and CPU type) and install Slurm
  hosts: role_slurm
  become: true
  roles: [slurm_packages]

- name: Slurm controller and accounting on the front node
  hosts: role_front
  become: true
  roles: [slurm_controller]

- name: Slurm on the compute machines
  hosts: role_compute
  become: true
  roles: [slurm_compute]

- name: Local scratch on the compute machines
  hosts: role_compute
  become: true
  roles: [scratch]

- name: Job modes (cluster-submit) and uv on the front node and the compute machines
  hosts: role_slurm
  become: true
  roles: [job_modes, uv]

- name: Metrics certificates and node exporters on every machine
  hosts: all
  become: true
  roles: [metrics_tls, node_metrics, machine_metrics]

- name: Prometheus, alerts, and Grafana on the front node
  hosts: role_front
  become: true
  roles: [prometheus, alerts, grafana]

- name: Status collector on the front node, home quota reader on the home machine
  hosts: role_front:role_home
  become: true
  roles: [monitoring]

# Nightly /home mirror: the key on the home machine, the receiving account on the backup machine (for a
# backup machine in the cluster), then the timer and a check that the destination accepts the key.
- name: Backup key on the home machine
  hosts: role_home
  become: true
  tasks:
    - name: Make or read the backup key
      ansible.builtin.include_role:
        name: backup
        tasks_from: key
      when: nanohpc.backup is not none

- name: Backup machine receives the mirror
  hosts: role_backup
  become: true
  tasks:
    - name: Set up the receiving account
      ansible.builtin.include_role:
        name: backup
        tasks_from: receive
      when: nanohpc.backup is not none and nanohpc.backup.kind == 'machine'

- name: Nightly backup on the home machine
  hosts: role_home
  become: true
  tasks:
    - name: Schedule the backup
      ansible.builtin.include_role:
        name: backup
        tasks_from: "{{ 'schedule' if nanohpc.backup is not none else 'off' }}"

- name: Test certificate server for the website (simulated clusters only)
  hosts: role_front
  become: true
  roles: [test_acme]

- name: Website on the front node
  hosts: role_front
  become: true
  roles: [website]

- name: Automatic deploys on the front node
  hosts: role_front
  become: true
  tasks:
    - name: Set up or remove automatic deploys
      ansible.builtin.include_role:
        name: auto_deploy
        tasks_from: "{{ 'main' if nanohpc.auto_deploy.enabled else 'off' }}"

- name: Health checks on every machine
  hosts: all
  become: true
  roles: [health]

# Fails the deploy only for broken services and mounts (cluster-health FAIL lines). A drained node or a
# full disk is a WARN line, shown but not a deploy error. Services can take a few seconds to settle after
# a fresh start, so a failing check is retried briefly. It checks the result of the real run, so the dry run
# skips it.
- name: Check that every machine works
  hosts: all
  become: true
  tasks:
    - name: Check this deploy's result
      when: not ansible_check_mode
      block:
        - name: Run cluster-health
          ansible.builtin.command: /usr/local/bin/cluster-health
          register: health
          changed_when: false
          failed_when: false
          until: health.rc == 0
          retries: 6
          delay: 10

        - name: Show the health report
          ansible.builtin.debug:
            msg: "{{ health.stdout_lines }}"

        - name: Stop if a check failed
          ansible.builtin.assert:
            that: health.rc == 0
            fail_msg: "{{ inventory_hostname }}: {{ health.stdout_lines | select('match', '^FAIL') | join('; ') }}"
            quiet: true
