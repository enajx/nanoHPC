# Install only nanoHPC's monitoring services. The machine's existing accounts, SSH, storage,
# jobs, and scheduler are outside this playbook.

- name: Check monitor machines before changing them
  hosts: all
  become: true
  pre_tasks:
    - name: Leave out a machine whose dry run failed
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} is left out: its dry run failed"
      when: inventory_hostname in nanohpc_left_out
  roles: [monitor_preflight]

- name: Record monitor mode and GPU inventory
  hosts: all
  become: true
  tasks:
    - name: Create nanoHPC folders
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: [/etc/nanohpc, /var/lib/nanohpc]

    - name: Record mode, role, and version
      ansible.builtin.copy:
        dest: "/etc/nanohpc/{{ item.name }}"
        content: "{{ item.value }}\n"
        owner: root
        group: root
        mode: "0644"
      loop:
        - {name: mode, value: monitor}
        - {name: roles, value: "{{ nanohpc.machines[inventory_hostname].roles[0] }}"}
        - {name: version, value: "{{ nanohpc.version }}"}

    - name: Record the accepted GPU inventory
      ansible.builtin.copy:
        dest: /etc/nanohpc/monitor-gpus.json
        content: "{{ nanohpc.gpu_baseline[inventory_hostname] | to_json }}\n"
        owner: root
        group: root
        mode: "0644"

    - name: Record the whole cluster's accepted GPU inventory on the monitoring host
      ansible.builtin.copy:
        dest: /etc/nanohpc/monitor-gpus-cluster.json
        content: "{{ nanohpc.gpu_baseline | to_json }}\n"
        owner: root
        group: root
        mode: "0644"
      when: inventory_hostname in groups['role_front']

# The Slack agent's runner key: made on the monitor host first, then every machine accepts it for root from the
# monitor host only (removed again when the agent is off).
- name: Slack agent runner key on the monitor host
  hosts: role_front
  become: true
  tasks:
    - name: Make or read the key
      ansible.builtin.include_role:
        name: agent
        tasks_from: key
      when: nanohpc.agent.enabled

- name: Slack agent runner key for root on every machine
  hosts: all
  become: true
  tasks:
    - name: Add or remove the key
      ansible.builtin.include_role:
        name: agent
        tasks_from: root_key

- name: Metrics certificates and exporters
  hosts: all
  become: true
  roles: [metrics_tls, node_metrics, machine_metrics]

- name: CrowdSec on every machine, or its removal when crowdsec.enabled is off
  hosts: all
  become: true
  tasks:
    - name: Set up or remove CrowdSec's SSH detection and its numbers
      ansible.builtin.include_role:
        name: crowdsec
        tasks_from: "{{ 'main' if nanohpc.crowdsec.enabled else 'off' }}"

- name: Prometheus, alerts, and Grafana
  hosts: role_front
  become: true
  roles: [prometheus, alerts, grafana]

- name: Status collector
  hosts: role_front
  become: true
  roles: [monitoring]

- name: Test certificate server for simulated clusters
  hosts: role_front
  become: true
  roles: [test_acme]

- name: Install the certificate tool dependency
  hosts: role_front
  become: true
  roles: [uv]

- name: Website
  hosts: role_front
  become: true
  roles: [website]

- name: Slack agent on the monitor host
  hosts: role_front
  become: true
  tasks:
    - name: Set up or remove the Slack agent
      ansible.builtin.include_role:
        name: agent
        tasks_from: "{{ 'main' if nanohpc.agent.enabled else 'off' }}"

# Each machine turns blocking on behind its own 15-minute undo and checks; a failure stops the run there.
- name: CrowdSec's blocking, one machine at a time
  hosts: all
  become: true
  serial: 1
  tasks:
    - name: Turn blocking on behind an automatic undo
      ansible.builtin.include_role:
        name: crowdsec
        tasks_from: blocking
      when: nanohpc.crowdsec.enabled

- name: Health checks
  hosts: all
  become: true
  roles: [health]

- name: Check the monitoring result
  hosts: all
  become: true
  tasks:
    - name: Run cluster-health
      ansible.builtin.import_role:
        name: health
        tasks_from: check
