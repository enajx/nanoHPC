# A deploy asked from Slack runs in its own unit (systemd-run), so restarting the runner does not stop it.
- name: Restart the Slack agent
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [nanohpc-agent-runner, nanohpc-agent]
  when: not ansible_check_mode
