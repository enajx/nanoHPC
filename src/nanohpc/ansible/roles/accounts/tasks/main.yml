# Users with fixed UIDs, keys outside home directories, key-only SSH, and who may log in where.
# Keys live in /etc/ssh/authorized_keys/<user> (0755 directory, 0644 files), readable by sshd even
# before /home is mounted, so a hidden or broken home folder never locks anyone out.

- name: Create the Slurm service group with a fixed GID
  ansible.builtin.group:
    name: slurm
    gid: "{{ nanohpc.slurm.uid }}"
    system: true

- name: Create the Slurm service user with a fixed UID
  ansible.builtin.user:
    name: slurm
    uid: "{{ nanohpc.slurm.uid }}"
    group: slurm
    system: true
    home: /var/lib/slurm
    create_home: false
    shell: /usr/sbin/nologin

- name: Create each user's group with GID equal to the UID
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.uid }}"
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the users with their fixed UIDs, without a password (SSH keys only)
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    shell: /bin/bash
    home: "/home/{{ item.name }}"
    create_home: false
    password: "!"
    update_password: on_create
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install sudo authentication by forwarded SSH key
  ansible.builtin.apt:
    name: libpam-ssh-agent-auth
    state: present
    install_recommends: false

- name: Put administrators in the sudo group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: sudo
    append: true
    create_home: false  # the user module would otherwise create a missing home folder
  loop: "{{ nanohpc.admins }}"

- name: Take the sudo group away from cluster users who are not administrators
  ansible.builtin.command: "gpasswd -d {{ item }} sudo"
  loop: "{{ nanohpc.users | map(attribute='name') | reject('in', nanohpc.admins) | list }}"
  when: item in (ansible_facts.getent_group['sudo'][2] | default('')).split(',')

- name: Create the folder of keys that unlock sudo
  ansible.builtin.file:
    path: /etc/security/nanohpc-sudo-keys
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install each administrator's keys for sudo
  ansible.builtin.copy:
    dest: "/etc/security/nanohpc-sudo-keys/{{ item.name }}"
    content: "{{ item.ssh_keys | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nanohpc.users | selectattr('name', 'in', nanohpc.admins) | list }}"
  loop_control:
    label: "{{ item.name }}"

- name: List the sudo key files
  ansible.builtin.find:
    paths: /etc/security/nanohpc-sudo-keys
  register: sudo_key_files

- name: Remove sudo keys of people who are no longer administrators
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sudo_key_files.files | rejectattr('path', 'search', '/(' ~ (nanohpc.admins | join('|')) ~ ')$') | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Let sudo check the forwarded SSH key first
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sudo
    line: "auth sufficient pam_ssh_agent_auth.so file=/etc/security/nanohpc-sudo-keys/%u"
    insertbefore: "^@include common-auth"
    firstmatch: true
  register: sudo_pam_line

- name: Read sudo's PAM setup
  ansible.builtin.slurp:
    src: /etc/pam.d/sudo
  register: sudo_pam

# In the dry run, a line still to be added can only be checked for the line it goes before.
- name: Require the forwarded-key check before the password check in sudo's PAM setup
  ansible.builtin.assert:
    that: >-
      (sudo_pam.content | b64decode).find('@include common-auth') != -1
      and ((ansible_check_mode and sudo_pam_line is changed)
           or ((sudo_pam.content | b64decode).find('pam_ssh_agent_auth.so') != -1
               and (sudo_pam.content | b64decode).find('pam_ssh_agent_auth.so') < (sudo_pam.content | b64decode).find('@include common-auth')))
    fail_msg: >-
      {{ inventory_hostname }}: /etc/pam.d/sudo does not have the usual '@include common-auth' line, so nanoHPC cannot put
      the forwarded-key check before the password check. Administrators' sudo by key would not work here.
    quiet: true

- name: Keep the forwarded SSH agent visible to sudo
  vars:
    sudo_agent_rule: "Defaults env_keep += \"SSH_AUTH_SOCK\"\n"
  block:
    - name: Check the sudo rule with visudo (dry run)
      ansible.builtin.include_role:
        name: dry_run_check
      vars:
        check_content: "{{ sudo_agent_rule }}"
        check_source: null
        check_command: /usr/sbin/visudo -cf %s
      when: ansible_check_mode

    - name: Install the sudo rule (checked with visudo first)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/nanohpc-ssh-agent
        content: "{{ sudo_agent_rule }}"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: Remove the passwordless sudo rule of earlier nanoHPC versions
  ansible.builtin.file:
    path: /etc/sudoers.d/nanohpc-admins
    state: absent

- name: Create the directory for SSH keys outside home directories
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install each user's SSH keys
  ansible.builtin.copy:
    dest: "/etc/ssh/authorized_keys/{{ item.name }}"
    content: "{{ item.ssh_keys | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"

# Users listed in cluster.yml are allowed through the list itself, and lose access when removed from it.
- name: Record the account this deploy logs in with, if it is not a user from cluster.yml
  ansible.builtin.lineinfile:
    path: /etc/nanohpc/deploy-accounts
    line: "{{ nanohpc_login_user }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: nanohpc_login_user not in (nanohpc.users | map(attribute='name')) and nanohpc_login_user != 'root'

- name: Make sure the list of deploy accounts exists
  ansible.builtin.file:
    path: /etc/nanohpc/deploy-accounts
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  register: deploy_accounts_list

- name: Read the accounts that have deployed to this machine
  ansible.builtin.slurp:
    src: /etc/nanohpc/deploy-accounts
  register: deploy_accounts
  when: not (ansible_check_mode and deploy_accounts_list is changed)  # dry run: the list is not there yet

- name: Name the deploy accounts that are not users from cluster.yml
  ansible.builtin.set_fact:
    deploy_account_names: >-
      {{ (((deploy_accounts.content | default('') | b64decode).split() + [nanohpc_login_user]) | unique)
         | reject('in', nanohpc.users | map(attribute='name')) | reject('equalto', 'root') | list }}

# The deploy accounts (for example `ubuntu`) are not in cluster.yml. Their SSH keys are copied out of
# their home folders, so they still log in when the shared /home or the home disk hides those folders.
- name: Keep the deploy accounts' SSH keys outside /home
  ansible.builtin.shell: |
    set -eu
    home=$(getent passwd "$ACCOUNT" | cut -d: -f6)
    source="$home/.ssh/authorized_keys"
    test -f "$source" || exit 0
    if ! cmp -s "$source" "/etc/ssh/authorized_keys/$ACCOUNT"; then
      if [ "$DRY_RUN" != True ]; then install -o root -g root -m 0644 "$source" "/etc/ssh/authorized_keys/$ACCOUNT"; fi
      echo changed
    fi
  environment:
    ACCOUNT: "{{ item }}"
    DRY_RUN: "{{ ansible_check_mode }}"  # the dry run only compares, and writes nothing
  loop: "{{ deploy_account_names }}"
  register: kept_keys
  changed_when: "'changed' in kept_keys.stdout"
  check_mode: false

# nanoHPC's own SSH accounts on this machine: the backup machine receives the nightly /home mirror as
# nanohpc-backup (a key that may only run rsync into the backup folder; the backup role installs it).
- name: Name nanoHPC's own SSH accounts on this machine
  ansible.builtin.set_fact:
    service_account_names: >-
      {{ (['nanohpc-backup'] if (nanohpc.backup is not none and nanohpc.backup.kind == 'machine'
                                 and inventory_hostname == nanohpc.backup.machine) else [])
         + (['root'] if nanohpc.auto_deploy.enabled else []) }}

# Automatic deploys: the front node logs in as root with its own key, accepted only from its address
# (key-only; the key file is on local disk, so it works without /home).
- name: Accept the front node's automatic deploy key for root
  ansible.builtin.copy:
    dest: /etc/ssh/authorized_keys/root
    owner: root
    group: root
    mode: "0644"
    content: |
      from="{{ nanohpc.metrics.front_address }}",no-agent-forwarding,no-X11-forwarding {{ hostvars[groups['role_front'][0]].auto_deploy_public_key }}
  when: nanohpc.auto_deploy.enabled

- name: List the installed SSH key files
  ansible.builtin.find:
    paths: /etc/ssh/authorized_keys
  register: ssh_key_files

- name: Remove SSH keys of users no longer in cluster.yml (deploy and nanoHPC accounts keep theirs)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ssh_key_files.files | rejectattr('path', 'search', '/(' ~ ((nanohpc.users | map(attribute='name') | list) + deploy_account_names + service_account_names) | join('|') ~ ')$') | list }}"
  loop_control:
    label: "{{ item.path | basename }}"

# Every account that has deployed to this machine stays allowed, so a deploy cannot lock out the
# account it runs as, nor the one an earlier deploy ran as (for example `ubuntu` on first setup).
- name: List who may log in on this machine
  ansible.builtin.set_fact:
    # root only from the front node's address (its automatic deploys), whatever keys root has elsewhere.
    ssh_allowed: >-
      {{ (((nanohpc.users | map(attribute='name') | list) if inventory_hostname in groups['role_front'] else nanohpc.admins)
          + deploy_account_names + (service_account_names | reject('equalto', 'root') | list)
          + (['root@' ~ nanohpc.metrics.front_address] if nanohpc.auto_deploy.enabled else [])
          + ([nanohpc_login_user] if (nanohpc_login_user != 'root' or not nanohpc.auto_deploy.enabled) else [])) | unique }}

- name: Change SSH access, and put the old file back unless the effective settings are right
  block:
    - name: Allow all users on the front node, and only administrators on the other machines
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-nanohpc.conf
        content: |
          # Managed by nanoHPC. Earlier files win in sshd_config.d, so this file sorts first.
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys/%u
          {% if nanohpc.auto_deploy.enabled %}
          PermitRootLogin prohibit-password
          {% endif %}
          AllowUsers {{ ssh_allowed | join(' ') }}
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: ssh_access

    # sshd -T prints the settings sshd would really use for this login, after every included file
    # and Match block, so a setting overridden elsewhere is caught before sshd is reloaded.
    # The dry run cannot check settings it has not written yet.
    - name: Read the effective SSH settings for the login account
      ansible.builtin.command: >-
        /usr/sbin/sshd -T -C user={{ nanohpc_login_user }},host={{ ansible_facts.hostname }},addr={{ nanohpc.machines[inventory_hostname].address }}
      register: ssh_effective
      changed_when: false
      check_mode: false
      when: not (ansible_check_mode and ssh_access is changed)

    - name: Require key-only login and the allowed accounts in the effective settings
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in ssh_effective.stdout_lines"
          - "('allowusers ' ~ (('root@' ~ nanohpc.metrics.front_address) if (nanohpc_login_user == 'root' and nanohpc.auto_deploy.enabled) else nanohpc_login_user)) in ssh_effective.stdout_lines"
          - >-
            not nanohpc.auto_deploy.enabled or ('permitrootlogin without-password' in ssh_effective.stdout_lines
            or 'permitrootlogin prohibit-password' in ssh_effective.stdout_lines)
          - ssh_effective.stdout_lines | select('match', '^allowgroups ') | list | length == 0
          - "'pubkeyauthentication yes' in ssh_effective.stdout_lines"
          - ssh_effective.stdout_lines | select('match', '^authorizedkeysfile .*/etc/ssh/authorized_keys/%u') | list | length == 1
        fail_msg: >-
          {{ inventory_hostname }}: another SSH setting overrides nanoHPC's (password login still on, key login off,
          the login account '{{ nanohpc_login_user }}' not allowed, or an AllowGroups rule). Check /etc/ssh/sshd_config
          and /etc/ssh/sshd_config.d/. The previous SSH settings were put back.
        quiet: true
      when: not (ansible_check_mode and ssh_access is changed)

    - name: Remove the backup of the previous SSH settings
      ansible.builtin.file:
        path: "{{ ssh_access.backup_file }}"
        state: absent
      when: ssh_access.backup_file is defined
  rescue:
    - name: Put the previous SSH settings back
      ansible.builtin.copy:
        src: "{{ ssh_access.backup_file }}"
        dest: /etc/ssh/sshd_config.d/10-nanohpc.conf
        remote_src: true
        mode: "0644"
      when: ssh_access.backup_file is defined

    - name: Remove the new SSH settings file (there was none before)
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d/10-nanohpc.conf
        state: absent
      when: ssh_access.changed | default(false) and ssh_access.backup_file is not defined

    - name: Stop this machine
      ansible.builtin.fail:
        msg: "{{ ansible_failed_result.msg | default('The SSH change failed; the previous settings were put back.') }}"

# Reloaded on every run, so an earlier run that stopped between writing and reloading is completed.
# A reload keeps open sessions.
- name: Apply the SSH access settings
  ansible.builtin.command: systemctl try-reload-or-restart ssh
  changed_when: ssh_access.changed
  when: not (ansible_check_mode and ssh_access is not changed)  # the dry run counts it only when the settings change

- name: Drop the open connection so the next task logs in fresh
  ansible.builtin.meta: reset_connection

- name: Prove that a fresh login still works after the SSH change
  ansible.builtin.ping:
