# Local /scratch on each compute machine: the administrator's disk (never formatted by nanoHPC), or
# an image file nanoHPC creates. Per-user folders, cache settings, and a daily cleanup of unused staged
# data.

- name: Name this machine's scratch
  ansible.builtin.set_fact:
    scratch: "{{ nanohpc.scratch.machines[inventory_hostname] }}"
    scratch_image: /var/lib/nanohpc/scratch.img

- name: Read what /scratch is now
  ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE --mountpoint /scratch
  register: scratch_mount
  changed_when: false
  failed_when: false

- name: Look at the /scratch folder
  ansible.builtin.find:
    paths: /scratch
    file_type: any
    hidden: true
  register: scratch_entries
  failed_when: false

- name: Refuse to hide files in an unmounted /scratch
  ansible.builtin.assert:
    that: scratch_mount.stdout != '' or scratch_entries.matched | default(0) == 0
    fail_msg: "{{ inventory_hostname }}: /scratch is not mounted but holds files; nanoHPC will not hide them. Move them away first."
    quiet: true

- name: Scratch on a disk
  when: scratch.device is not none
  block:
    # scratch_fs: the scratch disk's details, checked by the preflight role before any change.
    - name: Mount the scratch disk at /scratch
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/scratch\s'
        # nofail: a missing scratch disk must not stop the machine from booting (and so lock out SSH).
        line: "UUID={{ scratch_fs.UUID }} /scratch {{ scratch_fs.TYPE }} defaults,nodev,nosuid,nofail,x-systemd.device-timeout=30s 0 2"
        backup: true
      register: scratch_fstab

- name: Scratch in an image file
  when: scratch.image_gb is not none
  block:
    - name: Look for the scratch image
      ansible.builtin.stat:
        path: "{{ scratch_image }}"
      register: image

    - name: Refuse to resize an existing scratch image
      ansible.builtin.assert:
        that: not image.stat.exists or image.stat.size == scratch.image_gb * 1024 ** 3
        fail_msg: >-
          {{ inventory_hostname }}: {{ scratch_image }} is {{ (image.stat.size | default(0) / 1024 ** 3) | round(1) }} GB but
          cluster.yml asks for {{ scratch.image_gb }} GB. nanoHPC does not resize it: change image_gb back, or remove the image yourself.
        quiet: true

    - name: Create the scratch image
      when: not image.stat.exists
      block:
        # The image itself is 0600 and owned by root; /var/lib/nanohpc stays 0755 because other
        # nanoHPC folders inside it (the metrics textfile folder) are read by service accounts.
        - name: Create the image folder
          ansible.builtin.file:
            path: /var/lib/nanohpc
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Read the free space on the disk that holds the image
          ansible.builtin.command: df --output=avail,size -B1 /var/lib/nanohpc
          register: image_disk
          changed_when: false

        - name: Require 10% of the disk to stay free after the image
          ansible.builtin.assert:
            that: >-
              (image_disk.stdout_lines[1].split()[0] | int) - scratch.image_gb * 1024 ** 3
              >= (image_disk.stdout_lines[1].split()[1] | int) // 10
            fail_msg: >-
              {{ inventory_hostname }}: a {{ scratch.image_gb }} GB scratch image would leave less than 10% of the disk free.
              Use a smaller image_gb, or a scratch disk.
            quiet: true

        # Built under a temporary name and renamed once complete, so a failed run never leaves an
        # image without a filesystem that a later run would take as finished.
        - name: Build the scratch image (a file nanoHPC owns, not one of the administrator's disks)
          ansible.builtin.shell: |
            set -eu
            rm -f "$IMAGE.partial"
            fallocate --length "${SIZE}GiB" "$IMAGE.partial"
            chmod 0600 "$IMAGE.partial"
            mkfs.ext4 -q -m 0 -E nodiscard -L nanohpc-scratch "$IMAGE.partial"
            mv "$IMAGE.partial" "$IMAGE"
          environment:
            IMAGE: "{{ scratch_image }}"
            SIZE: "{{ scratch.image_gb }}"

    # Discards on the loop device would punch holes in the image and give its space back to the
    # root disk, so it could later run out. The image is never trimmed.
    - name: Turn off discards for the scratch image's loop device
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/99-nanohpc-scratch-no-discard.rules
        content: |
          ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="loop*", ATTR{loop/backing_file}=="{{ scratch_image }}", ATTR{queue/discard_max_bytes}="0"
        mode: "0644"
      register: trim_rule

    - name: Reload the udev rules
      ansible.builtin.command: udevadm control --reload-rules
      when: trim_rule.changed

    - name: Mount the scratch image at /scratch
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/scratch\s'
        line: "{{ scratch_image }} /scratch ext4 loop,nodev,nosuid,nofail 0 0"
        backup: true
      register: scratch_fstab

- name: Create the /scratch mount point
  ansible.builtin.file:
    path: /scratch
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: scratch_mount.stdout == ''

- name: Mount /scratch now
  ansible.builtin.command: mount /scratch
  when: scratch_mount.stdout == '' or scratch_fstab.changed
  register: scratch_mounted
  changed_when: true
  failed_when: scratch_mounted.rc != 0 and 'already mounted' not in scratch_mounted.stderr

- name: Check that /scratch is mounted from a local disk
  ansible.builtin.command: findmnt -n -o SOURCE,UUID --mountpoint /scratch
  register: scratch_now
  changed_when: false
  failed_when: not scratch_now.stdout.startswith('/dev/')

- name: Check that /scratch is the scratch disk from cluster.yml
  ansible.builtin.assert:
    that: scratch_now.stdout.split()[-1] == scratch_fs.UUID
    fail_msg: "{{ inventory_hostname }}: /scratch is mounted from {{ scratch_now.stdout.split()[0] }}, not from {{ scratch.device }}."
    quiet: true
  when: scratch.device is not none

- name: Apply the no-discard rule to the scratch image's loop device
  ansible.builtin.shell: |
    set -eu
    loop=$(findmnt -n -o SOURCE --mountpoint /scratch)
    udevadm trigger --action=change "$loop"
    udevadm settle
    cat "/sys/block/$(basename "$loop")/queue/discard_max_bytes"
  register: discard_bytes
  changed_when: false
  failed_when: discard_bytes.stdout | trim != '0'
  when: scratch.image_gb is not none

- name: Create the shared scratch folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /scratch, mode: "0755"}
    - {path: /scratch/staged, mode: "0711"}
    - {path: /scratch/staged/private, mode: "0711"}
    - {path: /scratch/locks, mode: "0755"}

- name: Create the lock files
  ansible.builtin.copy:
    dest: "/scratch/locks/{{ item }}"
    content: ""
    owner: root
    group: root
    mode: "0644"
    force: false
  loop: [cleanup.lock, capacity.lock]

- name: Create each user's private scratch folder and caches
  ansible.builtin.file:
    path: "/scratch/{{ item.0.name }}{{ item.1 }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0700"
  loop: "{{ nanohpc.users | product(['', '/uv-cache', '/hf-cache', '/torch-cache']) | list }}"
  loop_control:
    label: "/scratch/{{ item.0.name }}{{ item.1 }}"

- name: Create each user's private staging and lock folders
  ansible.builtin.file:
    path: "{{ item.1 }}/{{ item.0.uid }}"
    state: directory
    owner: "{{ item.0.name }}"
    group: "{{ item.0.name }}"
    mode: "0700"
  loop: "{{ nanohpc.users | product(['/scratch/staged/private', '/scratch/locks']) | list }}"
  loop_control:
    label: "{{ item.1 }}/{{ item.0.uid }}"

- name: Point uv, Hugging Face, and PyTorch caches to scratch
  ansible.builtin.copy:
    dest: /etc/profile.d/nanohpc-scratch-cache.sh
    content: |
      # Managed by nanoHPC: large caches go to local scratch, not the shared /home.
      if mountpoint -q /scratch && test -d "/scratch/$(id -un)"; then
        export UV_CACHE_DIR="/scratch/$(id -un)/uv-cache"
        export HF_HOME="/scratch/$(id -un)/hf-cache"
        export TORCH_HOME="/scratch/$(id -un)/torch-cache"
      fi
    mode: "0644"

- name: Write the scratch settings
  ansible.builtin.copy:
    dest: /etc/nanohpc/scratch.conf
    # Read by the cleanup, cluster-submit, and stage-dataset. A copy to scratch must leave at least
    # 1 GiB and 15% of the disk free, and 10,000 inodes.
    content: |
      SCRATCH_CLEANUP_DAYS={{ nanohpc.scratch.cleanup_days }}
      STAGE_MIN_FREE_BYTES=1073741824
      STAGE_CAPACITY_PERCENT=85
      STAGE_MIN_FREE_INODES=10000
    mode: "0644"

- name: Install stage-dataset
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/stage-dataset"
    dest: /usr/local/bin/stage-dataset
    mode: "0755"

- name: Install the scratch cleanup script
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/scratch-cleanup"
    dest: /usr/local/bin/scratch-cleanup
    mode: "0755"

- name: Run the cleanup with each user's own permissions
  ansible.builtin.copy:
    dest: /usr/local/sbin/scratch-cleanup-users
    mode: "0750"
    content: |
      #!/usr/bin/env bash
      # Managed by nanoHPC. One user's failure does not skip the others; the run still fails at the end.
      set -uo pipefail
      status=0
      {% for user in nanohpc.users %}
      runuser -u {{ user.name }} -- env SCRATCH_ROOT=/scratch/staged/private/{{ user.uid }} /usr/local/bin/scratch-cleanup || status=1
      {% endfor %}
      exit $status

- name: Install the scratch cleanup service and daily timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0644"
  loop:
    - name: nanohpc-scratch-cleanup.service
      content: |
        [Unit]
        Description=Remove unused staged scratch data (nanoHPC)
        RequiresMountsFor=/scratch

        [Service]
        Type=oneshot
        EnvironmentFile=/etc/nanohpc/scratch.conf
        ProtectSystem=strict
        ProtectHome=read-only
        ReadWritePaths=/scratch/staged /scratch/locks
        ExecStart=/usr/local/sbin/scratch-cleanup-users
    - name: nanohpc-scratch-cleanup.timer
      content: |
        [Unit]
        Description=Remove unused staged scratch data daily (nanoHPC)

        [Timer]
        OnCalendar=daily
        Persistent=true

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  register: cleanup_units

- name: Run the cleanup timer
  ansible.builtin.systemd_service:
    name: nanohpc-scratch-cleanup.timer
    enabled: true
    state: started
    daemon_reload: "{{ cleanup_units.changed }}"
