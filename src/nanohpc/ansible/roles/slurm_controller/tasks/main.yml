# Slurm controller, accounting database, partitions' QoS, and users' fair-share on the front node.
# Partitions are defined by the administrator in cluster.yml.

- name: Create the Slurm folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: slurm
    mode: "0755"
  loop:
    - {path: /etc/slurm, owner: root}
    - {path: /var/lib/slurm, owner: slurm}
    - {path: /var/lib/slurm/slurmctld, owner: slurm}
    - {path: /var/log/slurm, owner: slurm}

- name: Install the accounting database and the Lua checker for the submission rules
  ansible.builtin.apt:
    name: [mariadb-server, mariadb-client, lua5.3]
    state: present
    install_recommends: false
  register: controller_packages

- name: Keep the accounting database local to the front node
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/90-slurm.cnf
    owner: root
    group: root
    mode: "0644"
    content: |
      [mysqld]
      bind-address=127.0.0.1
      innodb_buffer_pool_size=256M
      innodb_lock_wait_timeout=900
      max_allowed_packet=16M
  notify: Restart the accounting database

- name: Run the accounting database
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started
  when: not (ansible_check_mode and controller_packages is changed)  # dry run: not installed yet

- name: Look for the database password file
  ansible.builtin.stat:
    path: /etc/nanohpc/slurmdbd.env
  register: database_secret_file

- name: Generate the database password on first setup only
  ansible.builtin.copy:
    dest: /etc/nanohpc/slurmdbd.env
    content: "SLURM_DB_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not database_secret_file.stat.exists
  no_log: true

- name: Read the database password
  ansible.builtin.slurp:
    src: /etc/nanohpc/slurmdbd.env
  register: database_secret
  no_log: true
  when: not (ansible_check_mode and not database_secret_file.stat.exists)  # dry run: not made yet

# In a dry run before the password exists, a stand-in of the same form (never written anywhere).
- name: Keep the password in a variable
  ansible.builtin.set_fact:
    slurmdbd_password: >-
      {{ (database_secret.content | b64decode).split('SLURM_DB_PASSWORD=')[1].splitlines()[0]
         if database_secret.content is defined else '0' * 64 }}
  no_log: true

- name: Require a generated password (64 hexadecimal characters)
  ansible.builtin.assert:
    that: slurmdbd_password is match('^[a-f0-9]{64}$')
    fail_msg: /etc/nanohpc/slurmdbd.env does not hold a password generated by nanoHPC.
    quiet: true
  no_log: true

- name: Create the accounting database and its local-only user, with the current password
  ansible.builtin.command:
    argv: [mariadb]
    stdin: |
      CREATE DATABASE IF NOT EXISTS slurm_acct_db;
      CREATE USER IF NOT EXISTS 'slurm'@'localhost' IDENTIFIED BY '{{ slurmdbd_password }}';
      ALTER USER 'slurm'@'localhost' IDENTIFIED BY '{{ slurmdbd_password }}';
      GRANT ALL PRIVILEGES ON slurm_acct_db.* TO 'slurm'@'localhost';
  changed_when: false
  no_log: true
  when: not ansible_check_mode  # changes the database user: real run only

- name: Check that the accounting user can log in to the database
  ansible.builtin.command:
    argv: [mariadb, --user=slurm, --database=slurm_acct_db, "--execute=SELECT 1"]
  environment:
    MYSQL_PWD: "{{ slurmdbd_password }}"
  changed_when: false
  check_mode: false
  no_log: true
  when: not (ansible_check_mode and (controller_packages is changed or not database_secret_file.stat.exists))  # dry run: no database or password yet

- name: Configure the Slurm accounting daemon
  ansible.builtin.copy:
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
    content: |
      AuthType=auth/munge
      DbdHost={{ ansible_facts.hostname }}
      DbdAddr={{ nanohpc.machines[inventory_hostname].address }}
      PidFile=/run/slurmdbd/slurmdbd.pid
      LogFile=/var/log/slurm/slurmdbd.log
      SlurmUser=slurm
      StorageType=accounting_storage/mysql
      StorageHost=localhost
      StorageLoc=slurm_acct_db
      StorageUser=slurm
      StoragePass={{ slurmdbd_password }}
      CommitDelay=1
  notify: Restart the Slurm accounting daemon
  no_log: true

# The dry run checks the submission rules with luac once Lua is installed.
- name: Note whether the Lua checker is there in this run
  ansible.builtin.set_fact:
    slurm_lua_pending: "{{ ansible_check_mode and controller_packages is changed }}"

- name: Slurm's configuration and the job submission rules
  ansible.builtin.import_tasks: slurm_config.yml

- name: Apply database changes
  ansible.builtin.meta: flush_handlers

- name: Run the Slurm accounting daemon
  ansible.builtin.service:
    name: slurmdbd
    enabled: true
    state: started
  register: slurmdbd_service
  when: not slurm_install_pending  # dry run: Slurm not installed yet

# The dry run reads the accounts and QoS only from a running accounting daemon (on a new front node it is
# not installed yet).
- name: Note whether the accounting daemon can answer in this run
  ansible.builtin.set_fact:
    slurm_accounting_pending: "{{ ansible_check_mode and (slurmdbd_service is changed or slurmdbd_service is skipped) }}"

- name: Accounts, QoS, and fair-share
  when: not slurm_accounting_pending
  block:
    - name: Wait for the accounting daemon to answer
      ansible.builtin.command: sacctmgr --noheader --parsable2 show cluster format=Cluster
      register: registered_clusters
      changed_when: false
      check_mode: false
      until: registered_clusters.rc == 0
      retries: 15
      delay: 2

    - name: Register the cluster
      ansible.builtin.command: "sacctmgr -i add cluster {{ nanohpc.cluster_name }}"
      when: nanohpc.cluster_name not in registered_clusters.stdout_lines

    - name: One QoS per partition, and the per-user limits
      ansible.builtin.import_tasks: qos.yml

    - name: The account every user belongs to, and the users' fair-share
      ansible.builtin.import_tasks: users.yml

- name: Run the Slurm controller, and the partitions' GPU limits
  ansible.builtin.import_tasks: slurmctld.yml
