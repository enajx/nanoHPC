# Slurm controller, accounting database, partitions' QoS, and users' fair-share on the front node.
# Ported from SLURM-REAL's roles/slurm_controller, generalized to admin-defined partitions.

- name: Create the Slurm folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: slurm
    mode: "0755"
  loop:
    - {path: /etc/slurm, owner: root}
    - {path: /var/lib/slurm, owner: slurm}
    - {path: /var/lib/slurm/slurmctld, owner: slurm}
    - {path: /var/log/slurm, owner: slurm}

- name: Install the accounting database and the Lua checker for the submission rules
  ansible.builtin.apt:
    name: [mariadb-server, mariadb-client, lua5.3]
    state: present
    install_recommends: false

- name: Keep the accounting database local to the front node
  ansible.builtin.copy:
    dest: /etc/mysql/mariadb.conf.d/90-slurm.cnf
    owner: root
    group: root
    mode: "0644"
    content: |
      [mysqld]
      bind-address=127.0.0.1
      innodb_buffer_pool_size=256M
      innodb_lock_wait_timeout=900
      max_allowed_packet=16M
  notify: Restart the accounting database

- name: Run the accounting database
  ansible.builtin.service:
    name: mariadb
    enabled: true
    state: started

- name: Look for the database password file
  ansible.builtin.stat:
    path: /etc/nanohpc/slurmdbd.env
  register: database_secret_file

- name: Generate the database password on first setup only
  ansible.builtin.copy:
    dest: /etc/nanohpc/slurmdbd.env
    content: "SLURM_DB_PASSWORD={{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}\n"
    owner: root
    group: root
    mode: "0600"
  when: not database_secret_file.stat.exists
  no_log: true

- name: Read the database password
  ansible.builtin.slurp:
    src: /etc/nanohpc/slurmdbd.env
  register: database_secret
  no_log: true

- name: Keep the password in a variable
  ansible.builtin.set_fact:
    slurmdbd_password: "{{ (database_secret.content | b64decode).split('SLURM_DB_PASSWORD=')[1].splitlines()[0] }}"
  no_log: true

- name: Require a generated password (64 hexadecimal characters)
  ansible.builtin.assert:
    that: slurmdbd_password is match('^[a-f0-9]{64}$')
    fail_msg: /etc/nanohpc/slurmdbd.env does not hold a password generated by nanoHPC.
    quiet: true
  no_log: true

- name: Create the accounting database and its local-only user, with the current password
  ansible.builtin.command:
    argv: [mariadb]
    stdin: |
      CREATE DATABASE IF NOT EXISTS slurm_acct_db;
      CREATE USER IF NOT EXISTS 'slurm'@'localhost' IDENTIFIED BY '{{ slurmdbd_password }}';
      ALTER USER 'slurm'@'localhost' IDENTIFIED BY '{{ slurmdbd_password }}';
      GRANT ALL PRIVILEGES ON slurm_acct_db.* TO 'slurm'@'localhost';
  changed_when: false
  no_log: true

- name: Check that the accounting user can log in to the database
  ansible.builtin.command:
    argv: [mariadb, --user=slurm, --database=slurm_acct_db, "--execute=SELECT 1"]
  environment:
    MYSQL_PWD: "{{ slurmdbd_password }}"
  changed_when: false
  no_log: true

- name: Configure the Slurm accounting daemon
  ansible.builtin.copy:
    dest: /etc/slurm/slurmdbd.conf
    owner: slurm
    group: slurm
    mode: "0600"
    content: |
      AuthType=auth/munge
      DbdHost={{ ansible_facts.hostname }}
      DbdAddr={{ nanohpc.machines[inventory_hostname].address }}
      PidFile=/run/slurmdbd/slurmdbd.pid
      LogFile=/var/log/slurm/slurmdbd.log
      SlurmUser=slurm
      StorageType=accounting_storage/mysql
      StorageHost=localhost
      StorageLoc=slurm_acct_db
      StorageUser=slurm
      StoragePass={{ slurmdbd_password }}
      CommitDelay=1
  notify: Restart the Slurm accounting daemon
  no_log: true

- name: Install slurm.conf and cgroup.conf
  ansible.builtin.copy:
    src: "{{ nanohpc.files }}/{{ item }}"
    dest: "/etc/slurm/{{ item }}"
    owner: root
    group: slurm
    mode: "0644"
  loop: [slurm.conf, cgroup.conf]
  register: controller_configuration

- name: Install the job submission rules
  ansible.builtin.copy:
    src: "{{ nanohpc.files }}/job_submit.lua"
    dest: /etc/slurm/job_submit.lua
    owner: root
    group: slurm
    mode: "0644"
    validate: /usr/bin/luac5.3 -p %s
  register: job_submit_rules

- name: Apply database changes
  ansible.builtin.meta: flush_handlers

- name: Run the Slurm accounting daemon
  ansible.builtin.service:
    name: slurmdbd
    enabled: true
    state: started

- name: Wait for the accounting daemon to answer
  ansible.builtin.command: sacctmgr --noheader --parsable2 show cluster format=Cluster
  register: registered_clusters
  changed_when: false
  until: registered_clusters.rc == 0
  retries: 15
  delay: 2

- name: Register the cluster
  ansible.builtin.command: "sacctmgr -i add cluster {{ nanohpc.cluster_name }}"
  when: nanohpc.cluster_name not in registered_clusters.stdout_lines

- name: Read the existing QoS names
  ansible.builtin.command: sacctmgr --noheader --parsable2 show qos format=Name
  register: existing_qos
  changed_when: false

- name: Create one QoS per partition
  ansible.builtin.command: "sacctmgr -i add qos {{ item.name }}"
  loop: "{{ nanohpc.qos }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in existing_qos.stdout_lines

- name: Read the QoS settings
  ansible.builtin.command: sacctmgr --noheader --parsable2 show qos format=Name,MaxWall,MaxTRESPJ,MaxTRESPU,MaxSubmitPU,Flags
  register: qos_rows
  changed_when: false

# sacctmgr reports "Modified" even when nothing differs, so each setting is compared first.
- name: Index the QoS settings by name
  ansible.builtin.set_fact:
    qos_now: >-
      {% set rows = {} %}{% for line in qos_rows.stdout_lines %}{% set fields = line.split('|') %}{% set _ = rows.update({fields[0]: fields}) %}{% endfor %}{{ rows }}

- name: Set each partition's time limit, refusing requests that cannot fit
  ansible.builtin.command: "sacctmgr -i modify qos {{ item.name }} set MaxWall={{ item.max_wall }} Flags=DenyOnLimit"
  loop: "{{ nanohpc.qos }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    item.name not in qos_now
    or qos_now[item.name][1] != item.max_wall
    or qos_now[item.name][5].split(',') | sort != ['DenyOnLimit']

- name: Set the per-user submission limit
  ansible.builtin.command: "sacctmgr -i modify qos normal set MaxSubmitJobsPerUser={{ nanohpc.max_submit_jobs_per_user }}"
  when: qos_now['normal'][4] != nanohpc.max_submit_jobs_per_user | string

- name: Read the accounts
  ansible.builtin.command: "sacctmgr --noheader --parsable2 show account {{ nanohpc.cluster_name }} format=Account"
  register: cluster_accounts
  changed_when: false

- name: Create the account every user belongs to
  ansible.builtin.command: "sacctmgr -i add account {{ nanohpc.cluster_name }} Cluster={{ nanohpc.cluster_name }} Description=nanoHPC QoS=normal"
  when: nanohpc.cluster_name not in cluster_accounts.stdout_lines

- name: Read the users' associations
  ansible.builtin.command: "sacctmgr --noheader --parsable2 show assoc where cluster={{ nanohpc.cluster_name }} account={{ nanohpc.cluster_name }} format=User"
  register: cluster_users
  changed_when: false

- name: Add the users as job submitters with equal fair-share
  ansible.builtin.command: >-
    sacctmgr -i add user {{ item.name }} Cluster={{ nanohpc.cluster_name }} Account={{ nanohpc.cluster_name }}
    DefaultAccount={{ nanohpc.cluster_name }} QoS=normal DefaultQoS=normal Fairshare=1
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name not in cluster_users.stdout_lines

- name: Read the users' fair-share
  ansible.builtin.command: >-
    sacctmgr --noheader --parsable2 show assoc where cluster={{ nanohpc.cluster_name }}
    account={{ nanohpc.cluster_name }} user={{ item.name }} format=Fairshare
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"
  register: user_shares
  changed_when: false

- name: Give every user an equal fair-share
  ansible.builtin.command: >-
    sacctmgr -i modify user where name={{ item.item.name }} cluster={{ nanohpc.cluster_name }}
    account={{ nanohpc.cluster_name }} set Fairshare=1
  loop: "{{ user_shares.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stdout | trim != '1'

- name: Run the Slurm controller
  ansible.builtin.service:
    name: slurmctld
    enabled: true
    state: "{{ 'restarted' if (controller_configuration.changed or job_submit_rules.changed) else 'started' }}"

- name: Wait for the controller to register the GPU resource type
  ansible.builtin.command: sacctmgr --noheader --parsable2 show tres format=Type,Name
  register: registered_resources
  changed_when: false
  until: "'gres|gpu' in registered_resources.stdout_lines"
  retries: 15
  delay: 2

- name: Read the QoS settings again
  ansible.builtin.command: sacctmgr --noheader --parsable2 show qos format=Name,MaxWall,MaxTRESPJ,MaxTRESPU,MaxSubmitPU,Flags
  register: qos_rows
  changed_when: false

# sacctmgr reports "Modified" even when nothing differs, so each setting is compared first.
- name: Index the QoS settings by name again
  ansible.builtin.set_fact:
    qos_now: >-
      {% set rows = {} %}{% for line in qos_rows.stdout_lines %}{% set fields = line.split('|') %}{% set _ = rows.update({fields[0]: fields}) %}{% endfor %}{{ rows }}

- name: Set each partition's GPU limits per job and per user
  ansible.builtin.command: >-
    sacctmgr -i modify qos {{ item.name }} set MaxTRESPerJob=gres/gpu={{ item.max_gpus_per_job }}
    MaxTRESPerUser=gres/gpu={{ item.max_gpus_per_user if item.max_gpus_per_user is not none else -1 }}
  loop: "{{ nanohpc.qos }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    qos_now[item.name][2] != 'gres/gpu=' ~ item.max_gpus_per_job
    or qos_now[item.name][3] != ('gres/gpu=' ~ item.max_gpus_per_user if item.max_gpus_per_user is not none else '')

- name: Set the cluster-wide GPU limit per user, checked before the partition limits
  ansible.builtin.command: >-
    sacctmgr -i modify qos normal set MaxTRESPerUser=gres/gpu={{ nanohpc.max_gpus_per_user }}
    Flags{{ '+' if nanohpc.max_gpus_per_user > 0 else '-' }}=OverPartQOS,DenyOnLimit
  when: >-
    qos_now['normal'][3] != ('gres/gpu=' ~ nanohpc.max_gpus_per_user if nanohpc.max_gpus_per_user > 0 else '')
    or ('OverPartQOS' in qos_now['normal'][5].split(',')) != (nanohpc.max_gpus_per_user > 0)
