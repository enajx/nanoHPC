- name: Restart the accounting database
  ansible.builtin.service:
    name: mariadb
    state: restarted
  when: not (ansible_check_mode and controller_packages is changed)  # dry run: not installed yet

- name: Restart the Slurm accounting daemon
  ansible.builtin.service:
    name: slurmdbd
    state: restarted
  when: not slurm_install_pending  # dry run: Slurm not installed yet
