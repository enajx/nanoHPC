# Every machine's /etc/hosts names every cluster machine (also run alone by --only node, on the other machines).

- name: Resolve every cluster machine by name, without depending on outside DNS
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} nanoHPC cluster machines"
    block: "{{ lookup('file', nanohpc.files + '/hosts') }}"
