- name: Name every cluster machine in /etc/hosts
  ansible.builtin.import_tasks: hosts.yml

- name: Create the nanoHPC configuration and data folders
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/nanohpc, /var/lib/nanohpc]

- name: Record this machine's roles from cluster.yml (read by cluster-health)
  ansible.builtin.copy:
    dest: /etc/nanohpc/roles
    content: "{{ nanohpc.machines[inventory_hostname].roles | join(' ') }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Record the nanoHPC version of this deploy (read by nanohpc check)
  ansible.builtin.copy:
    dest: /etc/nanohpc/version
    content: "{{ nanohpc.version }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Never restart a machine automatically after APT updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99nanohpc-no-automatic-reboot
    content: "Unattended-Upgrade::Automatic-Reboot \"false\";\n"
    owner: root
    group: root
    mode: "0644"

- name: Set up gated automatic security updates
  ansible.builtin.import_role:
    name: auto_updates

# Also in the dry run, which needs the lists to know what the package tasks would install. The lists are
# apt's copy of what the package sources offer: refreshing them changes no installed package or setting.
- name: Refresh the package lists
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  check_mode: false

- name: Require synchronized time (Munge refuses credentials across clock differences)
  ansible.builtin.command: timedatectl show -p NTPSynchronized --value
  register: clock_sync
  changed_when: false
  check_mode: false
  until: clock_sync.stdout | trim == 'yes'
  retries: 12
  delay: 5
