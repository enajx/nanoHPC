# The login banner on the front node (Slurm mode): nanohpc-hello shows the nanoHPC art, the user's summary,
# their private home usage box, links to the website, and the announcements from cluster.yml.

- name: Install the login banner command
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-hello"
    dest: /usr/local/bin/nanohpc-hello
    owner: root
    group: root
    mode: "0755"

- name: Write the cluster name and website address for the login banner
  ansible.builtin.copy:
    dest: /etc/nanohpc/login-banner.json
    content: "{{ {'cluster_name': nanohpc.cluster_name, 'website': nanohpc.website.hostname ~ nanohpc.website.path} | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Create the announcements folders (users cannot list the personal files)
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/nanohpc/announcements, mode: "0755"}
    - {path: /var/lib/nanohpc/announcements/users, mode: "0711"}

- name: Write the messages for everyone
  ansible.builtin.copy:
    dest: /var/lib/nanohpc/announcements/everyone.json
    content: "{{ nanohpc.announcements | rejectattr('users', 'defined') | list | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Write each user's own messages, readable only by that user
  ansible.builtin.copy:
    dest: "/var/lib/nanohpc/announcements/users/{{ item.name }}.json"
    content: >-
      {{ nanohpc.announcements | selectattr('users', 'defined') | selectattr('users', 'contains', item.name)
      | map('dict2items') | map('rejectattr', 'key', 'equalto', 'users') | map('items2dict') | list | to_nice_json }}
    owner: "{{ item.name }}"
    group: root
    mode: "0400"
  loop: "{{ nanohpc.users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Find the personal message files
  ansible.builtin.find:
    paths: /var/lib/nanohpc/announcements/users
    patterns: "*.json"
  register: personal_messages

- name: Remove the message files of users no longer in cluster.yml
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ personal_messages.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename | regex_replace('\\.json$', '')) not in (nanohpc.users | map(attribute='name') | list)

- name: Run the login banner in interactive bash and sh logins
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-login.sh"
    dest: /etc/profile.d/nanohpc-login.sh
    owner: root
    group: root
    mode: "0644"
    validate: /bin/sh -n %s

- name: Check whether zsh login profile exists
  ansible.builtin.stat:
    path: /etc/zsh/zprofile
  register: zsh_login_profile

- name: Run the login banner in zsh logins, before users' own ~/.zshrc and prompt themes
  ansible.builtin.blockinfile:
    path: /etc/zsh/zprofile
    marker: "# {mark} nanoHPC login banner"
    block: |
      if [ -r /etc/profile.d/nanohpc-login.sh ]; then
        . /etc/profile.d/nanohpc-login.sh
      fi
    validate: /usr/bin/zsh -n %s
  when: zsh_login_profile.stat.exists

- name: Remove the earlier usage box at login; the banner shows it
  ansible.builtin.file:
    path: /etc/profile.d/nanohpc-home-notice.sh
    state: absent

- name: Remove the earlier usage box block from zsh logins
  ansible.builtin.blockinfile:
    path: /etc/zsh/zprofile
    marker: "# {mark} nanoHPC home usage at login"
    state: absent
  when: zsh_login_profile.stat.exists

- name: Find Ubuntu's login message scripts on this machine
  ansible.builtin.find:
    paths: /etc/update-motd.d
    file_type: file
  register: motd_scripts

# pam_motd runs only executable scripts. The files stay, so administrators can switch any back on; a package
# upgrade may make one executable again, and the next deploy undoes that.
- name: Stop Ubuntu's login messages; the banner replaces them
  ansible.builtin.file:
    path: "/etc/update-motd.d/{{ item }}"
    mode: "0644"
  loop:
    - 00-header
    - 10-help-text
    - 50-motd-news
    - 85-fwupd
    - 90-updates-available
    - 91-contract-ua-esm-status
    - 91-release-upgrade
    - 92-unattended-upgrades
    - 95-hwe-eol
    - 98-fsck-at-reboot
    - 98-reboot-required
  when: ('/etc/update-motd.d/' ~ item) in (motd_scripts.files | map(attribute='path') | list)

# The "System information" block (package landscape-common) is a link, which has no mode of its own; removing
# the link keeps the package. An upgrade may add it back, and the next deploy removes it again.
- name: Stop Ubuntu's system information block at login
  ansible.builtin.file:
    path: /etc/update-motd.d/50-landscape-sysinfo
    state: absent
