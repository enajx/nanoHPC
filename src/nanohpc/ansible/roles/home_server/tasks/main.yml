# /home on the home machine: the administrator's disk (or the root disk) with user quotas,
# exported over NFS to the other machines. nanoHPC never formats a disk.

- name: Install the NFS server and quota tools
  ansible.builtin.apt:
    name: [nfs-kernel-server, quota]
    state: present
    install_recommends: false
  register: home_packages

# Quotas need the kernel's quota modules. Ubuntu's cloud kernels ship them in linux-modules-extra.
- name: Look for the kernel's quota module
  ansible.builtin.command: modinfo quota_v2
  register: quota_module
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install the kernel's extra modules, which hold the quota modules
  ansible.builtin.apt:
    name: "linux-modules-extra-{{ ansible_facts.kernel }}"
    state: present
    install_recommends: false
  when: quota_module.rc != 0

# A version-specific package covers this boot only. Keep the extra modules attached to the
# machine's existing kernel update track, so the next installed kernel can mount /home with quotas.
- name: Find the package that tracks quota modules for future kernels
  ansible.builtin.shell: |
    set -eu
    images="$(dpkg-query -W -f='${Package}\t${Status}\n' 'linux-image-*' 2>/dev/null |
      awk -F '\t' '$2 == "install ok installed" { print $1 }')"
    kernel="{{ ansible_facts.kernel }}"
    case "$kernel" in
      *-generic)
        tracks="$(printf '%s\n' "$images" | grep -E '^linux-image-virtual($|-)' || true)"
        if [ -n "$tracks" ]; then
          kind=virtual
          generic_tracks="$(printf '%s\n' "$images" | grep -E '^linux-image-generic($|-)' || true)"
        else
          tracks="$(printf '%s\n' "$images" | grep -E '^linux-image-generic($|-)' || true)"
          kind=generic
        fi
        ;;
      *-aws|*-azure|*-gcp|*-gke|*-gkeop|*-oracle)
        flavor="${kernel##*-}"
        tracks="$(printf '%s\n' "$images" | grep -E "^linux-image-${flavor}($|-)" || true)"
        kind=cloud
        ;;
      *)
        echo "$kernel: no known Ubuntu extra-module tracking package; keep the matching kernel image and extra modules installed before a reboot" >&2
        exit 1
        ;;
    esac
    count="$(printf '%s\n' "$tracks" | sed '/^$/d' | wc -l | tr -d ' ')"
    if [ "$count" != 1 ]; then
      echo "$kernel: expected one installed image tracking package, found: $tracks" >&2
      exit 1
    fi
    if [ "$kind" = virtual ]; then
      virtual_suffix="${tracks#linux-image-virtual}"
      for generic_track in $generic_tracks; do
        generic_suffix="${generic_track#linux-image-generic}"
        if [ "$generic_suffix" != "$virtual_suffix" ]; then
          echo "$kernel: $tracks and $generic_track use different kernel update tracks; choose one before deploying quotas" >&2
          exit 1
        fi
      done
    fi
    case "$kind" in
      virtual) target="linux-image-extra-virtual${tracks#linux-image-virtual}" ;;
      generic) target="$tracks" ;;
      cloud) target="linux-modules-extra-${tracks#linux-image-}" ;;
    esac
    if ! apt-cache show "$target" >/dev/null 2>&1; then
      echo "$kernel: $target is not available from Ubuntu's package sources" >&2
      exit 1
    fi
    printf '%s\n' "$target"
  register: quota_tracking_package
  changed_when: false
  check_mode: false

- name: Install the package that tracks quota modules for future kernels
  ansible.builtin.apt:
    name: "{{ quota_tracking_package.stdout }}"
    state: present
    install_recommends: false

- name: Load the quota modules at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/nanohpc-quota.conf
    content: "quota_v2\nquota_tree\n"
    mode: "0644"

- name: Load the quota modules now
  ansible.builtin.command: modprobe quota_v2
  changed_when: false
  when: not ansible_check_mode  # loads a kernel module: real run only

- name: Mount the home disk
  when: nanohpc.home.device is not none
  block:
    # home_fs: the home disk's details, checked by the preflight role before any change.
    - name: Mount the home disk at /home with user quotas
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/home\s'
        line: "UUID={{ home_fs.UUID }} /home {{ home_fs.TYPE }} defaults,nosuid,nodev,{{ 'usrquota' if home_fs.TYPE == 'ext4' else 'uquota' }} 0 2"
        backup: true
      register: home_fstab

    - name: Mount /home now
      ansible.builtin.command: mount /home
      when: (home_mount.stdout | default('')) == ''
      changed_when: true

    - name: Apply changed /home disk mount options now
      ansible.builtin.command: mount -o remount /home
      when: home_fstab.changed and (home_mount.stdout | default('')) != ''
      changed_when: true

    - name: Check that /home is the home disk
      ansible.builtin.command: findmnt -n -o UUID --mountpoint /home
      register: home_uuid
      changed_when: false
      check_mode: false
      failed_when: home_uuid.stdout | trim != home_fs.UUID
      when: not (ansible_check_mode and (home_fstab is changed or (home_mount.stdout | default('')) == ''))  # dry run: not mounted yet

- name: Read the filesystem that holds /home
  ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE,OPTIONS --target /home
  register: home_fs_now
  changed_when: false
  check_mode: false

- name: Require ext4 or XFS for /home
  ansible.builtin.assert:
    that: home_fs_now.stdout.split()[1] in ['ext4', 'xfs']
    fail_msg: "{{ inventory_hostname }}: /home is on {{ home_fs_now.stdout.split()[1] }}; quotas need ext4 or XFS."
    quiet: true

# /home on the root disk (no home.device): turn user quotas on for the root filesystem.
- name: Turn on user quotas for the root filesystem
  when: nanohpc.home.device is none
  block:
    # The dry run makes this role's two /etc/fstab changes (usrquota, the /home bind mount below) on a temporary
    # copy in /tmp and checks it with findmnt, as the real run checks /etc/fstab before writing it. This temporary
    # copy is the only thing a dry run writes here, besides refreshing apt's package lists.
    - name: Check the new /etc/fstab with findmnt (dry run)
      when: ansible_check_mode
      block:
        - name: Make a temporary copy of /etc/fstab
          ansible.builtin.tempfile:
            path: /tmp
            suffix: .nanohpc-dry-run
          register: fstab_check
          changed_when: false
          check_mode: false

        - name: Copy /etc/fstab into it
          ansible.builtin.copy:
            src: /etc/fstab
            dest: "{{ fstab_check.path }}"
            remote_src: true
            mode: "0600"
          changed_when: false
          check_mode: false

        - name: Add usrquota to the copy
          ansible.builtin.replace:
            path: "{{ fstab_check.path }}"
            regexp: '^(\S+\s+/\s+ext4\s+)(?!\S*usrquota)(\S+)'
            replace: '\1\2,usrquota'
          changed_when: false
          check_mode: false

        - name: Add the /home bind mount to the copy
          ansible.builtin.lineinfile:
            path: "{{ fstab_check.path }}"
            regexp: '^\S+\s+/home\s'
            line: "/home /home none bind,nosuid,nodev 0 0"
          changed_when: false
          check_mode: false

        - name: Check the copy with findmnt
          ansible.builtin.command: findmnt --verify --tab-file {{ fstab_check.path }}
          changed_when: false
          check_mode: false
      always:
        - name: Remove the temporary copy
          ansible.builtin.file:
            path: "{{ fstab_check.path }}"
            state: absent
          changed_when: false
          check_mode: false
          when: fstab_check.path is defined

    - name: Require ext4 for quotas on the root disk
      ansible.builtin.assert:
        that: home_fs_now.stdout.split()[1] == 'ext4'
        fail_msg: >-
          {{ inventory_hostname }}: /home is on the root disk with {{ home_fs_now.stdout.split()[1] }}; nanoHPC turns quotas on
          there only for ext4. Give /home its own disk (home.device in cluster.yml).
        quiet: true

    - name: Add usrquota to the root filesystem's options in /etc/fstab (checked before it is written)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\S+\s+/\s+ext4\s+)(?!\S*usrquota)(\S+)'
        replace: '\1\2,usrquota'
        backup: true
        validate: findmnt --verify --tab-file %s
      register: root_fstab

    - name: Check that the root filesystem's entry has usrquota
      ansible.builtin.command: findmnt -n -s -o OPTIONS --mountpoint /
      register: root_fstab_options
      changed_when: false
      check_mode: false
      failed_when: "'usrquota' not in root_fstab_options.stdout"
      when: not (ansible_check_mode and root_fstab is changed)  # dry run: /etc/fstab not changed yet

    - name: Apply usrquota to the mounted root filesystem
      ansible.builtin.command: mount -o remount,usrquota /
      when: "'usrquota' not in home_fs_now.stdout.split()[2] and 'quota' not in home_fs_now.stdout.split()[2]"

# /home on the root disk cannot be mounted nosuid by itself, so it is bind-mounted onto itself with nosuid.
- name: Mount /home on the root disk onto itself without setuid or device files
  when: nanohpc.home.device is none
  block:
    - name: Add the /home bind mount to /etc/fstab (checked before it is written)
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\S+\s+/home\s'
        line: "/home /home none bind,nosuid,nodev 0 0"
        backup: true
        validate: findmnt --verify --tab-file %s
      register: home_bind

    - name: Mount the /home bind now
      ansible.builtin.command: mount /home
      when: (home_mount.stdout | default('')) == ''
      changed_when: true

    - name: Apply changed /home bind mount options now
      ansible.builtin.command: mount -o remount,bind,nosuid,nodev /home
      when: home_bind.changed and (home_mount.stdout | default('')) != ''
      changed_when: true

- name: Check that /home has the required mount options
  ansible.builtin.command: findmnt -n -o OPTIONS --mountpoint /home
  register: home_options_now
  changed_when: false
  check_mode: false
  failed_when: "'nodev' not in home_options_now.stdout.split(',') or 'nosuid' not in home_options_now.stdout.split(',')"
  when: >-
    not (ansible_check_mode and
         ((nanohpc.home.device is not none and (home_fstab is changed or (home_mount.stdout | default('')) == ''))
          or (nanohpc.home.device is none and (home_bind is changed or (home_mount.stdout | default('')) == ''))))

# The dry run cannot read the quotas before the quota tools are installed and the filesystem that holds
# /home is mounted with quotas.
- name: Note whether the quotas can be read in this run
  ansible.builtin.set_fact:
    home_quota_pending: >-
      {{ ansible_check_mode and (home_packages is changed
         or (nanohpc.home.device is not none and (home_fstab is changed or (home_mount.stdout | default('')) == ''))
         or (nanohpc.home.device is none and 'quota' not in home_fs_now.stdout.split()[2])) }}

- name: The users' home folders and quotas
  ansible.builtin.import_tasks: users.yml

- name: Run the NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  when: not (ansible_check_mode and home_packages is changed)  # dry run: not installed yet

- name: Export /home to the machines that mount it
  ansible.builtin.import_tasks: exports.yml
