# /home on the home machine: the administrator's disk (or the root disk) with user quotas (disk.yml),
# exported over NFS to the other machines.

- name: Install the NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    install_recommends: false
  register: nfs_packages

- name: /home with user quotas
  ansible.builtin.import_tasks: disk.yml

# A missing /home disk must not prevent root SSH at boot or let NFS export
# the empty mount-point directory. The NFS service must require the mount.
- name: Create the NFS unit override folder
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Require the home mount before NFS starts
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-server.service.d/nanohpc-home.conf
    content: "[Unit]\nRequiresMountsFor=/home\n"
    owner: root
    group: root
    mode: "0644"
  register: home_nfs_unit

- name: Reload the NFS unit after changing its home mount requirement
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: home_nfs_unit.changed and not ansible_check_mode

- name: Check that NFS requires the home mount
  ansible.builtin.command: systemctl show nfs-server.service --property=Requires --value
  register: home_nfs_requires
  changed_when: false
  check_mode: false
  failed_when: "'home.mount' not in home_nfs_requires.stdout.split()"
  when: not ansible_check_mode

- name: Run the NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  when: not (ansible_check_mode and nfs_packages is changed)  # dry run: not installed yet

- name: Export /home to the machines that mount it
  ansible.builtin.import_tasks: exports.yml
