# Root's own SSH keys. The accounts role makes sshd read root's keys only from /etc/ssh/authorized_keys/root (the
# administrators' keys from cluster.yml). Until that setting is active, sshd also reads root's keys from its home
# folder, so a key there that is not an administrator's would stop working for root with this deploy, and could cut
# off whoever uses it (the deploy itself, or another person or system that logs in as root). Stop first.
# Variables: sshd_root_settings (the lines of `sshd -T` for root), root_key_files (root's key files in its home).

- name: Decide whether sshd still reads root's keys from its home folder (nanoHPC's root setting not active yet)
  ansible.builtin.set_fact:
    root_keys_from_home: >-
      {{ sshd_root_settings | select('match', '^authorizedkeysfile ') | list
         != ['authorizedkeysfile /etc/ssh/authorized_keys/root'] }}

- name: Look for root's own key files
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ root_key_files }}"
  register: root_key_files_found
  when: root_keys_from_home | bool

- name: Read root's own key files
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ root_key_files_found.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: root_key_files_read
  when: root_keys_from_home | bool and item.stat.exists

- name: Stop if root has keys in its home folder that are not administrators' keys in cluster.yml
  ansible.builtin.assert:
    that: keys_to_lose | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: root has keys in its home folder that are not administrators' keys in cluster.yml:
      {{ keys_to_lose | join('; ') }}. These keys will stop working for root after this deploy (nanoHPC makes sshd
      read root's keys only from /etc/ssh/authorized_keys/root). Delete them from that file, or add the key to an
      administrator in cluster.yml. Nothing was changed on this machine.
    quiet: true
  vars:
    keys_to_lose: >-
      {{ root_key_files_read.results
         | root_keys_to_lose(nanohpc.users | selectattr('name', 'in', nanohpc.admins) | map(attribute='ssh_keys')
                             | flatten) }}
