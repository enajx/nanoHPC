# Stop on a machine before any change when it cannot be set up safely.
# Every check here only reads; a machine that fails one is left exactly as it was.

- name: Require a supported Ubuntu release
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version in ['22.04', '24.04', '26.04']
    fail_msg: >-
      {{ inventory_hostname }} runs {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.
      nanoHPC supports Ubuntu 22.04, 24.04, and 26.04. Nothing was changed on this machine.
    quiet: true

- name: Read the existing user accounts
  ansible.builtin.getent:
    database: passwd

- name: Read the existing groups
  ansible.builtin.getent:
    database: group

- name: List the accounts nanoHPC manages (users from cluster.yml, and the slurm service account)
  ansible.builtin.set_fact:
    managed_accounts: "{{ nanohpc.users + [{'name': 'slurm', 'uid': nanohpc.slurm.uid}] }}"

- name: Stop if a listed user exists with a different UID or primary group
  ansible.builtin.assert:
    that: >-
      item.name not in ansible_facts.getent_passwd
      or ((ansible_facts.getent_passwd[item.name][1] | int) == item.uid
          and (ansible_facts.getent_passwd[item.name][2] | int) == item.uid)
    fail_msg: >-
      {{ inventory_hostname }}: user {{ item.name }} has UID {{ ansible_facts.getent_passwd[item.name][1] | default('?') }}
      and primary group ID {{ ansible_facts.getent_passwd[item.name][2] | default('?') }}, but cluster.yml says {{ item.uid }} for both.
      Nothing was changed on this machine. Harmonise the account on this machine first
      (change its UID and group ID and re-own its files), then run deploy again.
    quiet: true
  loop: "{{ managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop if a listed UID belongs to another user
  ansible.builtin.assert:
    that: >-
      ansible_facts.getent_passwd | dict2items
      | selectattr('value.1', 'equalto', item.uid | string)
      | rejectattr('key', 'equalto', item.name) | list | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: UID {{ item.uid }} (for {{ item.name }} in cluster.yml) already belongs to
      {{ ansible_facts.getent_passwd | dict2items | selectattr('value.1', 'equalto', item.uid | string) | map(attribute='key') | join(', ') }}.
      Nothing was changed on this machine. Choose another UID in cluster.yml or harmonise the accounts first.
    quiet: true
  loop: "{{ managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop if a listed user's group exists with another group ID
  ansible.builtin.assert:
    that: >-
      item.name not in ansible_facts.getent_group
      or (ansible_facts.getent_group[item.name][1] | int) == item.uid
    fail_msg: >-
      {{ inventory_hostname }}: group {{ item.name }} has group ID {{ ansible_facts.getent_group[item.name][1] | default('?') }},
      but nanoHPC gives it {{ item.uid }} (the same as the user's UID). Nothing was changed on this machine.
    quiet: true
  loop: "{{ managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Stop if a listed group ID belongs to another group
  ansible.builtin.assert:
    that: >-
      ansible_facts.getent_group | dict2items
      | selectattr('value.1', 'equalto', item.uid | string)
      | rejectattr('key', 'equalto', item.name) | list | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: group ID {{ item.uid }} (for {{ item.name }}) already belongs to group
      {{ ansible_facts.getent_group | dict2items | selectattr('value.1', 'equalto', item.uid | string) | map(attribute='key') | join(', ') }}.
      Nothing was changed on this machine. Choose another UID in cluster.yml or harmonise the groups first.
    quiet: true
  loop: "{{ managed_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read the NVIDIA GPUs on machines with real GPUs
  ansible.builtin.shell: |
    if ! command -v nvidia-smi >/dev/null 2>&1; then echo "no-driver"; exit 0; fi
    if ! output=$(nvidia-smi -L 2>&1); then echo "driver-error: $output"; exit 0; fi
    printf '%s\n' "$output" | grep -c '^GPU ' || true
  args:
    executable: /bin/bash
  register: gpu_check
  changed_when: false
  check_mode: false
  when: inventory_hostname in nanohpc.real_gpus

- name: Require the NVIDIA driver and the GPU count from cluster.yml
  ansible.builtin.assert:
    that: gpu_check.stdout | trim == nanohpc.real_gpus[inventory_hostname] | string
    fail_msg: >-
      {{ inventory_hostname }}:
      {% if gpu_check.stdout == 'no-driver' %}the NVIDIA driver is not installed (nvidia-smi not found). Install it first; nanoHPC does not install GPU drivers.
      {% elif gpu_check.stdout.startswith('driver-error') %}nvidia-smi fails, so the NVIDIA driver is not working ({{ gpu_check.stdout[14:] | trim }}). Fix the driver first.
      {% else %}nvidia-smi sees {{ gpu_check.stdout | trim }} GPUs, but cluster.yml says {{ nanohpc.real_gpus[inventory_hostname] }}.{% endif %}
      Nothing was changed on this machine.
    quiet: true
  when: inventory_hostname in nanohpc.real_gpus

# Facts are gathered through sudo, so they name root. The account nanoHPC logs in with must stay
# allowed by SSH, so read it without sudo.
- name: Read the account nanoHPC logs in with
  ansible.builtin.command: id -un
  become: false
  register: login_account
  changed_when: false
  check_mode: false

- name: Remember the login account
  ansible.builtin.set_fact:
    nanohpc_login_user: "{{ login_account.stdout | trim }}"

# An administrator's sudo comes from their key file, which this deploy removes when they are no longer
# an administrator. Deploying as such an account would lose sudo halfway through, so stop first.
- name: Look for a sudo key file of the login account
  ansible.builtin.stat:
    path: "/etc/security/nanohpc-sudo-keys/{{ nanohpc_login_user }}"
  register: login_sudo_keys

- name: Stop if the login account is a former administrator
  ansible.builtin.assert:
    that: not login_sudo_keys.stat.exists or nanohpc_login_user in nanohpc.admins
    fail_msg: >-
      {{ inventory_hostname }}: you are deploying as {{ nanohpc_login_user }}, who is no longer an administrator in
      cluster.yml, so their sudo would be removed during this deploy. Nothing was changed on this machine.
      Deploy as a current administrator.
    quiet: true

# The address is this machine's own, as in the accounts role's check of root's settings.
- name: Read the effective SSH settings for root
  ansible.builtin.command: >-
    /usr/sbin/sshd -T -C user=root,host={{ ansible_facts.hostname }},addr={{ nanohpc.machines[inventory_hostname].address }}
  register: sshd_root
  changed_when: false
  check_mode: false

- name: Check root's own SSH keys
  ansible.builtin.include_tasks: root_keys.yml
  vars:
    sshd_root_settings: "{{ sshd_root.stdout_lines }}"
    root_key_files: [/root/.ssh/authorized_keys, /root/.ssh/authorized_keys2]

# /home: the shared /home (NFS) or the home disk is mounted over the local /home folder. Stop if that
# would hide anything other than the home folders of the accounts nanoHPC deploys with.
- name: Read where /home comes from now
  ansible.builtin.command: findmnt -n -o SOURCE,FSTYPE --mountpoint /home
  register: home_mount
  changed_when: false
  check_mode: false
  failed_when: false

- name: Read the home disk's ID
  ansible.builtin.command: "blkid -s UUID -o value {{ nanohpc.home.device }}"
  register: home_disk_uuid
  changed_when: false
  check_mode: false
  failed_when: false
  when: inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none

- name: Read the ID of the disk mounted at /home
  ansible.builtin.command: findmnt -n -o UUID --mountpoint /home
  register: home_mounted_uuid
  changed_when: false
  check_mode: false
  failed_when: false
  when: inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none

- name: Stop if /home is already mounted from another disk
  ansible.builtin.assert:
    that: home_mount.stdout == '' or home_mounted_uuid.stdout | trim == home_disk_uuid.stdout | trim
    fail_msg: >-
      {{ inventory_hostname }}: /home is already mounted from {{ home_mount.stdout.split()[0] | default('?') }}, not from
      {{ nanohpc.home.device }} (home.device in cluster.yml). Nothing was changed on this machine.
    quiet: true
  when: inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none

- name: Decide whether this deploy mounts something over the local /home
  ansible.builtin.set_fact:
    home_will_mount: >-
      {{ (inventory_hostname in nanohpc.home.clients
          and home_mount.stdout.split() != [nanohpc.home.server_address ~ ':/home', 'nfs4'])
         or (inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none and home_mount.stdout == '') }}

- name: Look for the list of deploy accounts
  ansible.builtin.stat:
    path: /etc/nanohpc/deploy-accounts
  register: deploy_accounts_file
  when: home_will_mount | bool

- name: Read the list of deploy accounts
  ansible.builtin.slurp:
    src: /etc/nanohpc/deploy-accounts
  register: deploy_accounts_now
  when: home_will_mount | bool and deploy_accounts_file.stat.exists

- name: Name the home folders that may stay hidden (the deploy accounts', whose keys are kept)
  ansible.builtin.set_fact:
    hideable_homes: >-
      {{ ['lost+found']
         + ((((deploy_accounts_now.content | default('') | b64decode).split() + [nanohpc_login_user]) | unique)
            | reject('in', nanohpc.users | map(attribute='name'))
            | select('in', ansible_facts.getent_passwd)
            | map('extract', ansible_facts.getent_passwd) | map(attribute=4)
            | select('match', '^/home/[^/]+$') | map('basename') | list) }}
  when: home_will_mount | bool

- name: List what is in the local /home, with where each link points
  ansible.builtin.command: find /home -mindepth 1 -maxdepth 1 -printf '%f\t%l\n'
  register: local_home
  changed_when: false
  check_mode: false
  when: home_will_mount | bool

- name: Stop if the mount would hide anything else in /home
  ansible.builtin.assert:
    that: unexpected | length == 0
    fail_msg: >-
      {{ inventory_hostname }}: /home holds {{ unexpected | join(', ') }}.
      {% if inventory_hostname == nanohpc.home.server %}Mounting the home disk ({{ nanohpc.home.device }}) at /home would hide
      {{ 'it' if unexpected | length == 1 else 'them' }}. Nothing was changed on this machine. Copy it onto the home disk or
      remove it, then run deploy again.{% else %}Mounting the shared /home would hide {{ 'it' if unexpected | length == 1 else 'them' }}.
      Nothing was changed on this machine. Move it to the home machine ({{ nanohpc.home.server }}) or remove it, then run
      deploy again.{% endif %}
    quiet: true
  vars:
    # An entry may stay hidden if it is a deploy account's home folder, or a link to one.
    unexpected: >-
      {%- set found = [] -%}
      {%- for line in local_home.stdout_lines -%}
        {%- set name, target = (line ~ '\t').split('\t')[:2] -%}
        {%- if name not in hideable_homes and (target == '' or (target | basename) not in hideable_homes) -%}
          {%- set _ = found.append(name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ found }}
  when: home_will_mount | bool

- name: Check the home disk
  ansible.builtin.include_tasks: check_disk.yml
  vars:
    disk: "{{ nanohpc.home.device }}"
    disk_use: /home
    mkfs_hint: "mkfs.ext4 -O quota"
  when: inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none

- name: Keep the home disk's details
  ansible.builtin.set_fact:
    home_fs: "{{ disk_fs }}"
  when: inventory_hostname == nanohpc.home.server and nanohpc.home.device is not none

- name: Check the scratch disk
  ansible.builtin.include_tasks: check_disk.yml
  vars:
    disk: "{{ nanohpc.scratch.machines[inventory_hostname].device }}"
    disk_use: /scratch
    mkfs_hint: mkfs.ext4
  when: inventory_hostname in nanohpc.scratch.machines and nanohpc.scratch.machines[inventory_hostname].device is not none

- name: Keep the scratch disk's details
  ansible.builtin.set_fact:
    scratch_fs: "{{ disk_fs }}"
  when: inventory_hostname in nanohpc.scratch.machines and nanohpc.scratch.machines[inventory_hostname].device is not none
