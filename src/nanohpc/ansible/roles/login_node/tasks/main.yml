# A login node (role `login`): users log in and run Slurm's commands here, as on the front node, but the Slurm
# controller, monitoring and website stay on the front node. slurmd does not run here (no jobs). Its /home: the
# shared one (home_client role) or its own (home_mount: own, home_own role).

- name: Slurm's configuration
  ansible.builtin.import_tasks: slurm_config.yml

- name: The login banner's data from the front node
  ansible.builtin.import_tasks: receive.yml
