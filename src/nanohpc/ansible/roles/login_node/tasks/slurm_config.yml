# slurm.conf and cgroup.conf on a login node (also for --only policy, partitions, node).
- name: Create the Slurm configuration folder
  ansible.builtin.file:
    path: /etc/slurm
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install slurm.conf and cgroup.conf, so Slurm's commands reach the controller
  ansible.builtin.copy:
    src: "{{ nanohpc.files }}/{{ item }}"
    dest: "/etc/slurm/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [slurm.conf, cgroup.conf]
