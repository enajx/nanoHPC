# Collectors that write node_exporter textfiles in /var/lib/nanohpc/metrics-textfile:
# - machine specs (OS, kernel, CPU, GPU model and memory, driver and CUDA versions, pending updates,
#   restart needed) on every machine, every 5 minutes;
# - GPU readings every 30 seconds on machines with GPUs: from nvidia-smi for real GPUs, made-up values
#   for the fake GPUs of a simulated machine.
# - wall power every 30 seconds on machines with readable IPMI power-supply input sensors.

- name: Install what the machine spec collector reads
  ansible.builtin.apt:
    name: [python3, python3-apt]
    state: present
    install_recommends: false

- name: Install the collectors
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  loop: [cluster-machine-specs, cluster-gpu-metrics, cluster-fake-gpu-metrics]

- name: Create the shared home speed-test folder
  ansible.builtin.file:
    path: /home/.nanohpc-speed-test
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: nanohpc.mode | default('slurm') != 'monitor' and inventory_hostname == nanohpc.home.server

- name: Install the nightly speed-test command
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/cluster-speed-test"
    dest: /usr/local/bin/cluster-speed-test
    owner: root
    group: root
    mode: "0755"

- name: Install the nightly speed-test service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-speed-test.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Measure this machine's home and Internet speed (nanoHPC)
      {% if inventory_hostname in (groups['role_compute'] | default([])) and nanohpc.mode | default('slurm') != 'monitor' %}RequiresMountsFor=/home/.nanohpc-speed-test{% endif %}

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/cluster-speed-test {{ '--folder /home/.nanohpc-speed-test --large-mb 256 --small-files 500' if inventory_hostname in (groups['role_compute'] | default([])) and nanohpc.mode | default('slurm') != 'monitor' else '--internet-only' }} --output /var/lib/nanohpc/metrics-textfile/speed.prom --url https://files.pythonhosted.org/packages/fd/df/23c69e9b9fd19fe6563422f1bc59f89601bda47234a89a1cf432cfde3aee/torch-2.14.1-cp314-cp314-manylinux_2_28_x86_64.whl --internet-seconds 15
      TimeoutStartSec=10min
      NoNewPrivileges=true
      ProtectSystem=strict
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      ReadWritePaths=/var/lib/nanohpc/metrics-textfile{{ ' /home/.nanohpc-speed-test' if inventory_hostname in (groups['role_compute'] | default([])) and nanohpc.mode | default('slurm') != 'monitor' else '' }}
      MemoryMax=256M
  register: speed_service

- name: Install the nightly speed-test timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-speed-test.timer
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Measure home and Internet speed each night (nanoHPC)

      [Timer]
      OnCalendar=*-*-* {{ '%02d' | format((4 + (3 * groups['all'].index(inventory_hostname)) // 60) % 24) }}:{{ '%02d' | format((3 * groups['all'].index(inventory_hostname)) % 60) }}:00
      AccuracySec=1s
      Unit=nanohpc-speed-test.service

      [Install]
      WantedBy=timers.target
  register: speed_timer

# A speed run fills the shared home link for several seconds. Start with the nightly timer, not during deploy.
- name: Schedule the nightly speed test
  ansible.builtin.systemd_service:
    name: nanohpc-speed-test.timer
    enabled: true
    state: started
    daemon_reload: true
  when: not (ansible_check_mode and (speed_service.changed or speed_timer.changed))

- name: Name this machine's GPU collector
  ansible.builtin.set_fact:
    gpu: "{{ nanohpc.metrics.gpus[inventory_hostname] | default(none) }}"

- name: Choose the collector commands
  ansible.builtin.set_fact:
    specs_command: >-
      /usr/local/bin/cluster-machine-specs --root / --output /var/lib/nanohpc/metrics-textfile/specs.prom
      {%- if gpu is not none and gpu.fake %} --fake-gpu-count {{ gpu.count }} --fake-gpu-type {{ gpu.type }}{% endif %}
    gpu_command: >-
      {%- if gpu is none %}{%- elif gpu.fake -%}
      /usr/local/bin/cluster-fake-gpu-metrics --count {{ gpu.count }} --type {{ gpu.type }} --output /var/lib/nanohpc/metrics-textfile/gpu.prom
      {%- else -%}
      /usr/local/bin/cluster-gpu-metrics --output /var/lib/nanohpc/metrics-textfile/gpu.prom
      {%- endif %}

- name: Install the collector services and timers
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.0 }}.{{ item.1 }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item.1 == 'service' %}
      [Unit]
      Description={{ 'Machine specs' if item.0 == 'nanohpc-machine-specs' else 'GPU readings' }} for metrics (nanoHPC)

      [Service]
      Type=oneshot
      ExecStart={{ specs_command if item.0 == 'nanohpc-machine-specs' else gpu_command }}
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      ReadWritePaths=/var/lib/nanohpc/metrics-textfile
      {% else %}
      [Unit]
      Description=Run {{ item.0 }} regularly (nanoHPC)

      [Timer]
      OnBootSec=30s
      OnUnitActiveSec={{ '5min' if item.0 == 'nanohpc-machine-specs' else '30s' }}
      AccuracySec=1s

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: "{{ (['nanohpc-machine-specs'] + (['nanohpc-gpu-metrics'] if gpu is not none else [])) | product(['service', 'timer']) | list }}"
  loop_control:
    label: "{{ item.0 }}.{{ item.1 }}"
  register: collector_units

- name: Run the collectors once now (a failure here shows the collector's error)
  ansible.builtin.systemd_service:
    name: "{{ item }}.service"
    state: started
    daemon_reload: "{{ collector_units.changed }}"
  loop: "{{ ['nanohpc-machine-specs'] + (['nanohpc-gpu-metrics'] if gpu is not none else []) }}"
  changed_when: false  # a one-off run of a collector, not a change to the machine
  when: not (ansible_check_mode and collector_units is changed)  # dry run: the services are not installed yet

- name: Run the collector timers
  ansible.builtin.systemd_service:
    name: "{{ item }}.timer"
    enabled: true
    state: started
  loop: "{{ ['nanohpc-machine-specs'] + (['nanohpc-gpu-metrics'] if gpu is not none else []) }}"
  when: not (ansible_check_mode and collector_units is changed)  # dry run: the timers are not installed yet

- name: Check that the collectors wrote their metrics
  ansible.builtin.stat:
    path: "/var/lib/nanohpc/metrics-textfile/{{ item }}"
  register: collector_output
  failed_when: not collector_output.stat.exists
  loop: "{{ ['specs.prom'] + (['gpu.prom'] if gpu is not none else []) }}"
  when: not ansible_check_mode  # checks this deploy's result

# A machine whose GPUs were removed from cluster.yml loses its GPU collector and its last readings.
- name: Look for an old GPU collector
  ansible.builtin.stat:
    path: /etc/systemd/system/nanohpc-gpu-metrics.timer
  register: old_gpu_timer
  when: gpu is none

- name: Stop the old GPU collector
  ansible.builtin.systemd_service:
    name: nanohpc-gpu-metrics.timer
    enabled: false
    state: stopped
  when: gpu is none and old_gpu_timer.stat.exists

- name: Remove the GPU collector and its last readings
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/nanohpc-gpu-metrics.timer
    - /etc/systemd/system/nanohpc-gpu-metrics.service
    - /var/lib/nanohpc/metrics-textfile/gpu.prom
  when: gpu is none

- name: Set up wall-power readings where the management chip supports them
  ansible.builtin.include_tasks: power.yml
