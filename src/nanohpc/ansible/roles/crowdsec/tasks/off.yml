# CrowdSec off (cluster.yml crowdsec.enabled false): a machine where it was on stops blocking (the undo command
# stops the bouncer and removes its rule), CrowdSec and its numbers stop, and the numbers go from the exporter. The
# packages stay installed. A machine that never had it changes nothing.

- name: Look for CrowdSec's undo command
  ansible.builtin.stat:
    path: /usr/local/sbin/nanohpc-crowdsec-undo
  register: crowdsec_off_undo

- name: Stop the blocking
  ansible.builtin.command: /usr/local/sbin/nanohpc-crowdsec-undo
  changed_when: true
  when: crowdsec_off_undo.stat.exists and not ansible_check_mode

- name: Look for CrowdSec and its numbers timer
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/lib/systemd/system/crowdsec.service, /etc/systemd/system/nanohpc-security-metrics.timer]
  register: crowdsec_off_units

- name: Stop them
  ansible.builtin.systemd_service:
    name: "{{ item.item | basename }}"
    state: stopped
    enabled: false
  loop: "{{ crowdsec_off_units.results | selectattr('stat.exists') | list }}"
  loop_control:
    label: "{{ item.item | basename }}"

- name: Remove the numbers, their units, and the undo command
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/nanohpc/metrics-textfile/security.prom
    - /etc/systemd/system/nanohpc-security-metrics.timer
    - /etc/systemd/system/nanohpc-security-metrics.service
    - /usr/local/sbin/nanohpc-crowdsec-undo
