# CrowdSec's blocking (cluster.yml crowdsec.enabled): its firewall bouncer drops traffic from the addresses CrowdSec
# decided to block, 4 hours each (CrowdSec's default); never the never-block list (tasks/main.yml). It could cut
# access, so it is turned on behind an automatic undo after 15 minutes (it stops the bouncer and removes its rule),
# cancelled only after a test block works, a never-block address is refused, and fresh logins work; any failure
# undoes it at once. Run one machine at a time (serial: 1 in the playbooks). Once the pinned bouncer runs and its
# rule is in the firewall, later deploys only read that.

- name: Name the bouncer package for this machine's CPU type
  ansible.builtin.set_fact:
    crowdsec_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Read the installed bouncer version
  ansible.builtin.command: dpkg-query -W -f=${Version} crowdsec-firewall-bouncer-iptables
  register: crowdsec_bouncer_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read whether the bouncer runs
  ansible.builtin.command: systemctl is-active crowdsec-firewall-bouncer
  register: crowdsec_bouncer_active
  changed_when: false
  failed_when: false
  check_mode: false

# A machine without iptables yet gets it with the bouncer package.
- name: Read the firewall's input rules
  ansible.builtin.command: iptables -S INPUT
  register: crowdsec_input_now
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether blocking is on already
  ansible.builtin.set_fact:
    crowdsec_blocking_on: >-
      {{ crowdsec_bouncer_installed.stdout == crowdsec_bouncer_version
         and crowdsec_bouncer_active.stdout == 'active'
         and '-j CROWDSEC_CHAIN' in crowdsec_input_now.stdout }}

- name: Turn blocking on, or undo it
  when: not crowdsec_blocking_on
  block:
    - name: Read the undo timer
      ansible.builtin.command: systemctl is-active nanohpc-crowdsec-undo.timer
      register: crowdsec_old_undo
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Refuse while an earlier undo is still set
      ansible.builtin.assert:
        that: crowdsec_old_undo.stdout != 'active'
        fail_msg: nanohpc-crowdsec-undo.timer is still set from an earlier run; check the machine by hand first.

    - name: Install the undo command
      ansible.builtin.copy:
        src: "{{ nanohpc.package_files }}/nanohpc-crowdsec-undo"
        dest: /usr/local/sbin/nanohpc-crowdsec-undo
        owner: root
        group: root
        mode: "0755"

    - name: Download the pinned firewall bouncer, checking its SHA-256
      ansible.builtin.get_url:
        url: "{{ crowdsec_package_url }}/crowdsec-firewall-bouncer/crowdsec-firewall-bouncer-iptables_{{ crowdsec_bouncer_version }}_{{ crowdsec_arch }}.deb"
        dest: "{{ crowdsec_packages }}/crowdsec-firewall-bouncer-iptables_{{ crowdsec_bouncer_version }}_{{ crowdsec_arch }}.deb"
        checksum: "sha256:{{ crowdsec_bouncer_sha256[crowdsec_arch] }}"
        mode: "0644"
        timeout: 120
      register: crowdsec_bouncer_download
      until: crowdsec_bouncer_download is succeeded
      retries: 3
      delay: 5
      # A dry run on a new machine has no package folder yet (tasks/main.yml).
      when: not crowdsec_new_in_dry_run

    - name: Set the automatic undo
      ansible.builtin.command:
        argv: [systemd-run, --unit=nanohpc-crowdsec-undo, --on-active=15min, /usr/local/sbin/nanohpc-crowdsec-undo]
      changed_when: true
      when: not ansible_check_mode

    # Only an undo this run set is ever run by the failure steps below.
    - name: Note that this run set the undo
      ansible.builtin.set_fact:
        crowdsec_undo_set: true
      when: not ansible_check_mode

    - name: Install the firewall bouncer (it registers with the local CrowdSec and starts)
      ansible.builtin.apt:
        deb: "{{ crowdsec_packages }}/crowdsec-firewall-bouncer-iptables_{{ crowdsec_bouncer_version }}_{{ crowdsec_arch }}.deb"
      environment:
        DEBIAN_FRONTEND: noninteractive
      # A dry run downloads nothing, so there is no package to install.
      when: not ansible_check_mode

    - name: Run it
      ansible.builtin.systemd_service:
        name: crowdsec-firewall-bouncer
        state: started
        enabled: true
      when: not ansible_check_mode

    - name: Require its rule in the firewall
      ansible.builtin.command: iptables -S INPUT
      register: crowdsec_input
      changed_when: false
      retries: 6
      delay: 5
      until: "'-j CROWDSEC_CHAIN' in crowdsec_input.stdout"
      when: not ansible_check_mode

    - name: Block the test address for 5 minutes
      ansible.builtin.command:
        argv: [cscli, decisions, add, --ip, "{{ crowdsec_test_address }}", --duration, 5m, --reason, blocking test (nanoHPC/crowdsec)]
      changed_when: true
      when: not ansible_check_mode

    - name: Require the test address in the firewall's block list
      ansible.builtin.shell: set -o pipefail; ipset list | grep -E "^{{ crowdsec_test_address | regex_escape }}( |$)"
      args:
        executable: /bin/bash
      register: crowdsec_test_blocked
      changed_when: false
      retries: 6
      delay: 5
      until: crowdsec_test_blocked.rc == 0
      when: not ansible_check_mode

    - name: Remove the test block
      ansible.builtin.command:
        argv: [cscli, decisions, delete, --ip, "{{ crowdsec_test_address }}"]
      changed_when: true
      when: not ansible_check_mode

    - name: Require the test address gone from the block list
      ansible.builtin.shell: set -o pipefail; sets=$(ipset list) && ! grep -E "^{{ crowdsec_test_address | regex_escape }}( |$)" <<< "$sets"
      args:
        executable: /bin/bash
      register: crowdsec_test_gone
      changed_when: false
      retries: 6
      delay: 5
      until: crowdsec_test_gone.rc == 0
      when: not ansible_check_mode

    # The first never-block address is a cluster machine's.
    - name: Require a never-block address to be refused
      ansible.builtin.command:
        argv: [cscli, decisions, add, --ip, "{{ nanohpc.crowdsec.never_block[0] }}", --duration, 1m, --reason, allowlist test (nanoHPC/crowdsec)]
      register: crowdsec_never_block_test
      changed_when: false
      failed_when: "'is allowlisted' not in crowdsec_never_block_test.stderr + crowdsec_never_block_test.stdout"
      when: not ansible_check_mode

    - name: Check a fresh login as the deploy's account
      ansible.builtin.command:
        argv: "{{ ['ssh'] + (['-F', nanohpc.crowdsec.ssh_config] if nanohpc.crowdsec.ssh_config else []) + ['-o', 'BatchMode=yes', '-o', 'ControlPath=none', '-o', 'ConnectTimeout=20', inventory_hostname, 'true'] }}"
      delegate_to: localhost
      become: false
      changed_when: false
      when: not ansible_check_mode

    # Slurm mode sets up root logins for the administrators; monitor mode does not.
    - name: Check a fresh root login
      ansible.builtin.command:
        argv: "{{ ['ssh'] + (['-F', nanohpc.crowdsec.ssh_config] if nanohpc.crowdsec.ssh_config else []) + ['-o', 'BatchMode=yes', '-o', 'ControlPath=none', '-o', 'ConnectTimeout=20', '-l', 'root', inventory_hostname, 'true'] }}"
      delegate_to: localhost
      become: false
      changed_when: false
      when: not ansible_check_mode and nanohpc.crowdsec.root_login

    - name: Cancel the automatic undo
      ansible.builtin.command: systemctl stop nanohpc-crowdsec-undo.timer
      changed_when: true
      when: not ansible_check_mode

  rescue:
    - name: Undo the blocking now
      ansible.builtin.command: systemctl start nanohpc-crowdsec-undo.service
      changed_when: true
      failed_when: false
      when: not ansible_check_mode and crowdsec_undo_set | default(false)

    - name: Cancel the undo timer after undoing
      ansible.builtin.command: systemctl stop nanohpc-crowdsec-undo.timer
      changed_when: true
      failed_when: false
      when: not ansible_check_mode and crowdsec_undo_set | default(false)

    - name: Stop after a failure
      ansible.builtin.fail:
        msg: >-
          CrowdSec's blocking stopped at '{{ ansible_failed_task.name }}' on {{ inventory_hostname }};
          {{ 'the blocking was undone' if crowdsec_undo_set | default(false) else 'nothing was changed' }}.
          Check with: iptables -S | grep -i crowdsec
