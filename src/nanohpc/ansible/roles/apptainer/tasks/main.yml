# Official non-setuid Apptainer packages are available for Ubuntu on amd64 and arm64.
- name: Install the Ubuntu PPA tools for Apptainer
  ansible.builtin.apt:
    name: [software-properties-common, python3-launchpadlib, ca-certificates]
    state: present
    install_recommends: false

- name: Add Apptainer's official Ubuntu repository
  ansible.builtin.apt_repository:
    repo: ppa:apptainer/ppa
    filename: nanohpc-apptainer
    state: present
    update_cache: true
  register: apptainer_repository

- name: Install Apptainer without setuid mode
  ansible.builtin.apt:
    name: apptainer
    state: present
    install_recommends: false
  register: apptainer_package
  when: not (ansible_check_mode and apptainer_repository.changed)

- name: Check the installed Apptainer command
  ansible.builtin.command: /usr/bin/apptainer --version
  register: apptainer_version
  changed_when: false
  check_mode: false
  failed_when: not apptainer_version.stdout.startswith('apptainer version ')
  when: not (ansible_check_mode and (apptainer_repository.changed or apptainer_package.changed | default(false)))
