- name: Create the systemd-logind settings folder
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ignore the power, reboot, sleep, and hibernate keys
  ansible.builtin.copy:
    src: 50-nanohpc-ignore-buttons.conf
    dest: /etc/systemd/logind.conf.d/50-nanohpc-ignore-buttons.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart systemd-logind

- name: Let systemd-logind read the settings now
  ansible.builtin.meta: flush_handlers

- name: Check that systemd-logind ignores the power button
  ansible.builtin.command: busctl get-property org.freedesktop.login1 /org/freedesktop/login1 org.freedesktop.login1.Manager HandlePowerKey
  register: power_button_setting
  changed_when: false
  failed_when: power_button_setting.stdout | trim != 's "ignore"'
  when: not ansible_check_mode
