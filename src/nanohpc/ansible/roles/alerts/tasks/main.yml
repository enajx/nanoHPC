# Alertmanager on the front node (127.0.0.1:9093). Prometheus sends it the alerts from the alert rules
# (health checks failing or warning on any machine, missing machine metrics, failed or old backups). With
# Slack on, it posts when an alert starts and when it resolves, and does not repeat it in between; with
# Slack off, alerts are only visible on the front node. The webhook is a file only Alertmanager can read.

- name: Name the download for this machine's CPU type
  ansible.builtin.set_fact:
    metrics_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Name the Alertmanager folder
  ansible.builtin.set_fact:
    alertmanager_dir: "/opt/nanohpc-metrics/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}"

- name: Create the Alertmanager service account
  ansible.builtin.user:
    name: cluster-alertmanager
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Alertmanager, checking its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ nanohpc.metrics.alertmanager.version }}/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    checksum: "sha256:{{ nanohpc.metrics.alertmanager.sha256[metrics_arch] }}"
    mode: "0644"
    timeout: 120
  register: alertmanager_download

- name: Unpack Alertmanager (owned by root, whatever the archive says)
  ansible.builtin.unarchive:
    src: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: /opt/nanohpc-metrics
    remote_src: true
    extra_opts: [--no-same-owner]
    owner: root
    group: root
    creates: "{{ alertmanager_dir }}/alertmanager"
  when: not (ansible_check_mode and alertmanager_download is changed)  # dry run: not downloaded yet

- name: Create the Alertmanager folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: cluster-alertmanager
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/nanohpc/alertmanager, owner: root, mode: "0750"}
    - {path: /var/lib/nanohpc/alertmanager, owner: cluster-alertmanager, mode: "0750"}

- name: Install the Slack webhook (readable only by Alertmanager)
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/slack-webhook
    content: "{{ nanohpc_secrets.slack_webhook }}"
    owner: root
    group: cluster-alertmanager
    mode: "0640"
  no_log: true
  register: slack_webhook
  when: nanohpc.alerts.slack

- name: Remove the Slack webhook when Slack alerts are off
  ansible.builtin.file:
    path: /etc/nanohpc/alertmanager/slack-webhook
    state: absent
  register: slack_webhook_removed
  when: not nanohpc.alerts.slack

- name: Install the optional Slack bot token
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/slack-bot-token
    content: "{{ nanohpc_secrets.slack_bot_token }}"
    owner: root
    group: cluster-alertmanager
    mode: "0640"
  no_log: true
  when: nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token is not none

- name: Remove the Slack bot token when unset
  ansible.builtin.file:
    path: /etc/nanohpc/alertmanager/slack-bot-token
    state: absent
  when: not (nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token is not none)

- name: Install the Alertmanager configuration
  vars:
    alertmanager_config_text: |
      # Generated by nanoHPC. Alerts are sent when they start and when they resolve, not repeated in between
      # (repeat_interval and the notification log both last a year).
      route:
        receiver: {{ 'slack' if nanohpc.alerts.slack else 'none' }}
        group_by: [alertname, machine, check]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 8760h
      receivers:
        - name: none
      {% if nanohpc.alerts.slack %}
        - name: slack
          slack_configs:
            - api_url_file: /etc/nanohpc/alertmanager/slack-webhook
              send_resolved: true
              title: '[{{ nanohpc.cluster_name }}] {% raw %}{{ if eq .Status "firing" }}Problem{{ else }}Resolved{{ end }}: {{ .CommonLabels.alertname }}{% endraw %}'
              text: '{% raw %}{{ range .Alerts }}{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} {{ .Annotations.summary }}{{ "\n" }}{{ end }}{% endraw %}'
      {% endif %}
  block:
    - name: Check the Alertmanager configuration with amtool (dry run)
      ansible.builtin.include_role:
        name: dry_run_check
      vars:
        check_content: "{{ alertmanager_config_text }}"
        check_source: null
        check_command: "{{ alertmanager_dir }}/amtool check-config %s"
      when: ansible_check_mode and not (alertmanager_download is changed)

    - name: Install the Alertmanager configuration (checked with amtool first)
      ansible.builtin.copy:
        dest: /etc/nanohpc/alertmanager/alertmanager.yml
        owner: root
        group: cluster-alertmanager
        mode: "0640"
        validate: "{{ alertmanager_dir }}/amtool check-config %s"
        content: "{{ alertmanager_config_text }}"
      register: alertmanager_config

- name: Install the Alertmanager service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-alertmanager.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Cluster alerts (nanoHPC)
      After=network-online.target nanohpc-prometheus.service
      Wants=network-online.target

      [Service]
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart={{ alertmanager_dir }}/alertmanager --config.file=/etc/nanohpc/alertmanager/alertmanager.yml \
        --storage.path=/var/lib/nanohpc/alertmanager --data.retention=8760h \
        --web.listen-address=127.0.0.1:9093 --cluster.listen-address=
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager
      MemoryMax=256M

      [Install]
      WantedBy=multi-user.target
  register: alertmanager_unit

- name: Run Alertmanager
  ansible.builtin.systemd_service:
    name: nanohpc-alertmanager
    enabled: true
    daemon_reload: "{{ alertmanager_unit.changed }}"
    state: >-
      {{ 'restarted' if (alertmanager_unit.changed or alertmanager_config.changed or slack_webhook.changed
         or slack_webhook_removed.changed) else 'started' }}
  when: not (ansible_check_mode and alertmanager_unit is changed)  # dry run: the service is not installed yet

- name: Wait until Alertmanager is ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
  register: alertmanager_ready
  until: alertmanager_ready.status == 200
  retries: 30
  delay: 2
  when: not ansible_check_mode  # checks this deploy's result

- name: Check that Prometheus sends its alerts to Alertmanager
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/alertmanagers
    return_content: true
  register: prometheus_alertmanagers
  until: (prometheus_alertmanagers.json.data.activeAlertmanagers | length) == 1
  retries: 15
  delay: 2
  when: not ansible_check_mode  # checks this deploy's result

# The user check publishes findings as Prometheus metrics. This timer sends
# channel notices through the existing Slack webhook and optional private
# messages through a bot token. It is off in monitor
# mode, where there is no Slurm user check, and whenever Slack is off.
- name: Install the user check channel notifier
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-user-check-notify"
    dest: /usr/local/bin/nanohpc-user-check-notify
    owner: root
    group: root
    mode: "0755"

- name: Install the user check channel notifier service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nanohpc-user-check-notify.{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item == 'service' %}
      [Unit]
      Description=Post user check findings to Slack (nanoHPC)
      After=network-online.target nanohpc-prometheus.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart=/usr/local/bin/nanohpc-user-check-notify \
        --prometheus http://127.0.0.1:9090 \
        --webhook-file /etc/nanohpc/alertmanager/slack-webhook \
        --state /var/lib/nanohpc/alertmanager/user-check.json --now now{% if nanohpc.mode | default('slurm') != 'monitor' %}{% for user in nanohpc.users %} --user {{ user.name }}:{{ user.slack_id | default('') }}{% endfor %}{% endif %}{% if nanohpc_secrets.slack_bot_token | default(None) %} --bot-token-file /etc/nanohpc/alertmanager/slack-bot-token{% endif %}
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager
      MemoryMax=128M
      {% else %}
      [Unit]
      Description=Check user findings for Slack every minute (nanoHPC)

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min
      AccuracySec=10s

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: [service, timer]
  register: user_check_notify_units

- name: Run the user check channel notifier timer
  ansible.builtin.systemd_service:
    name: nanohpc-user-check-notify.timer
    enabled: "{{ nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor' }}"
    state: "{{ 'started' if nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor' else 'stopped' }}"
    daemon_reload: "{{ user_check_notify_units.changed }}"
  when: not (ansible_check_mode and user_check_notify_units is changed)

- name: Check the user check channel notifier now
  ansible.builtin.systemd_service:
    name: nanohpc-user-check-notify.service
    state: started
  changed_when: false
  when: not ansible_check_mode and nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor'
