# Alertmanager on the front node (127.0.0.1:9093). Prometheus sends it the alerts from the alert rules
# (health checks failing or warning on any machine, missing machine metrics, failed or old backups). With
# Slack on, it posts when an alert starts and when it resolves, and does not repeat it in between; with
# Slack off, alerts are only visible on the front node. The webhook is a file only Alertmanager can read.

- name: Name the download for this machine's CPU type
  ansible.builtin.set_fact:
    metrics_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Name the Alertmanager folder
  ansible.builtin.set_fact:
    alertmanager_dir: "/opt/nanohpc-metrics/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}"

- name: Create the Alertmanager service account
  ansible.builtin.user:
    name: cluster-alertmanager
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Alertmanager, checking its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ nanohpc.metrics.alertmanager.version }}/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    checksum: "sha256:{{ nanohpc.metrics.alertmanager.sha256[metrics_arch] }}"
    mode: "0644"

- name: Unpack Alertmanager (owned by root, whatever the archive says)
  ansible.builtin.unarchive:
    src: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: /opt/nanohpc-metrics
    remote_src: true
    extra_opts: [--no-same-owner]
    owner: root
    group: root
    creates: "{{ alertmanager_dir }}/alertmanager"

- name: Create the Alertmanager folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: cluster-alertmanager
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/nanohpc/alertmanager, owner: root, mode: "0750"}
    - {path: /var/lib/nanohpc/alertmanager, owner: cluster-alertmanager, mode: "0750"}

- name: Install the Slack webhook (readable only by Alertmanager)
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/slack-webhook
    content: "{{ nanohpc_secrets.slack_webhook }}"
    owner: root
    group: cluster-alertmanager
    mode: "0640"
  no_log: true
  register: slack_webhook
  when: nanohpc.alerts.slack

- name: Remove the Slack webhook when Slack alerts are off
  ansible.builtin.file:
    path: /etc/nanohpc/alertmanager/slack-webhook
    state: absent
  register: slack_webhook_removed
  when: not nanohpc.alerts.slack

- name: Install the Alertmanager configuration (checked with amtool first)
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/alertmanager.yml
    owner: root
    group: cluster-alertmanager
    mode: "0640"
    validate: "{{ alertmanager_dir }}/amtool check-config %s"
    content: |
      # Generated by nanoHPC. Alerts are sent when they start and when they resolve, not repeated in between
      # (repeat_interval and the notification log both last a year).
      route:
        receiver: {{ 'slack' if nanohpc.alerts.slack else 'none' }}
        group_by: [alertname, machine, check]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 8760h
      receivers:
        - name: none
      {% if nanohpc.alerts.slack %}
        - name: slack
          slack_configs:
            - api_url_file: /etc/nanohpc/alertmanager/slack-webhook
              send_resolved: true
              title: '[{{ nanohpc.cluster_name }}] {% raw %}{{ if eq .Status "firing" }}Problem{{ else }}Resolved{{ end }}: {{ .CommonLabels.alertname }}{% endraw %}'
              text: '{% raw %}{{ range .Alerts }}{{ if eq .Status "firing" }}:red_circle:{{ else }}:large_green_circle:{{ end }} {{ .Annotations.summary }}{{ "\n" }}{{ end }}{% endraw %}'
      {% endif %}
  register: alertmanager_config

- name: Install the Alertmanager service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-alertmanager.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Cluster alerts (nanoHPC)
      After=network-online.target nanohpc-prometheus.service
      Wants=network-online.target

      [Service]
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart={{ alertmanager_dir }}/alertmanager --config.file=/etc/nanohpc/alertmanager/alertmanager.yml \
        --storage.path=/var/lib/nanohpc/alertmanager --data.retention=8760h \
        --web.listen-address=127.0.0.1:9093 --cluster.listen-address=
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager
      MemoryMax=256M

      [Install]
      WantedBy=multi-user.target
  register: alertmanager_unit

- name: Run Alertmanager
  ansible.builtin.systemd_service:
    name: nanohpc-alertmanager
    enabled: true
    daemon_reload: "{{ alertmanager_unit.changed }}"
    state: >-
      {{ 'restarted' if (alertmanager_unit.changed or alertmanager_config.changed or slack_webhook.changed
         or slack_webhook_removed.changed) else 'started' }}

- name: Wait until Alertmanager is ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
  register: alertmanager_ready
  until: alertmanager_ready.status == 200
  retries: 30
  delay: 2

- name: Check that Prometheus sends its alerts to Alertmanager
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/alertmanagers
    return_content: true
  register: prometheus_alertmanagers
  until: (prometheus_alertmanagers.json.data.activeAlertmanagers | length) == 1
  retries: 15
  delay: 2
