# Alertmanager on the front node (127.0.0.1:9093). Prometheus sends it the alerts from the alert rules
# (health checks failing or warning on any machine, missing machine metrics, failed or old backups). With
# Slack on, it posts an alert once, when it starts: not when it ends, and not again while it lasts. The alert
# rules keep each alert firing for 7 days after it ends, so one that comes back within 7 days posts nothing.
# With Slack off, alerts are only visible on the front node. The webhook is a file only Alertmanager can read.

- name: Name the download for this machine's CPU type
  ansible.builtin.set_fact:
    metrics_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"

- name: Name the Alertmanager folder
  ansible.builtin.set_fact:
    alertmanager_dir: "/opt/nanohpc-metrics/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}"

- name: Create the Alertmanager service account
  ansible.builtin.user:
    name: cluster-alertmanager
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Download Alertmanager, checking its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/alertmanager/releases/download/v{{ nanohpc.metrics.alertmanager.version }}/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    checksum: "sha256:{{ nanohpc.metrics.alertmanager.sha256[metrics_arch] }}"
    mode: "0644"
    timeout: 120
  register: alertmanager_download

- name: Unpack Alertmanager (owned by root, whatever the archive says)
  ansible.builtin.unarchive:
    src: "/var/tmp/alertmanager-{{ nanohpc.metrics.alertmanager.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: /opt/nanohpc-metrics
    remote_src: true
    extra_opts: [--no-same-owner]
    owner: root
    group: root
    creates: "{{ alertmanager_dir }}/alertmanager"
  when: not (ansible_check_mode and alertmanager_download is changed)  # dry run: not downloaded yet

- name: Create the Alertmanager folders
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: cluster-alertmanager
    mode: "{{ item.mode }}"
  loop:
    - {path: /etc/nanohpc/alertmanager, owner: root, mode: "0750"}
    - {path: /var/lib/nanohpc/alertmanager, owner: cluster-alertmanager, mode: "0750"}

- name: Install the Slack webhook (readable only by Alertmanager)
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/slack-webhook
    content: "{{ nanohpc_secrets.slack_webhook }}"
    owner: root
    group: cluster-alertmanager
    mode: "0640"
  no_log: true
  register: slack_webhook
  when: nanohpc.alerts.slack

- name: Remove the Slack webhook when Slack alerts are off
  ansible.builtin.file:
    path: /etc/nanohpc/alertmanager/slack-webhook
    state: absent
  register: slack_webhook_removed
  when: not nanohpc.alerts.slack

- name: Install the optional Slack bot token
  ansible.builtin.copy:
    dest: /etc/nanohpc/alertmanager/slack-bot-token
    content: "{{ nanohpc_secrets.slack_bot_token }}"
    owner: root
    group: cluster-alertmanager
    mode: "0640"
  no_log: true
  when: nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token is not none

- name: Remove the Slack bot token when unset
  ansible.builtin.file:
    path: /etc/nanohpc/alertmanager/slack-bot-token
    state: absent
  when: not (nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token is not none)

- name: Install the Alertmanager configuration
  vars:
    alertmanager_config_text: |
      # Generated by nanoHPC. Alerts are sent once, when they start: not when they end, and not repeated
      # (repeat_interval and the notification log both last a year).
      route:
        receiver: {{ 'slack' if nanohpc.alerts.slack else 'none' }}
        group_by: [alertname, machine, check]
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 8760h
      receivers:
        - name: none
      {% if nanohpc.alerts.slack %}
        - name: slack
          slack_configs:
            - api_url_file: /etc/nanohpc/alertmanager/slack-webhook
              send_resolved: false
              title: '[{{ nanohpc.cluster_name }}] Problem: {% raw %}{{ .CommonLabels.alertname }}{% endraw %}'
              text: '{% raw %}{{ range .Alerts.Firing }}:red_circle: {{ .Annotations.summary }}{{ "\n" }}{{ end }}{% endraw %}'
      {% endif %}
  block:
    - name: Check the Alertmanager configuration with amtool (dry run)
      ansible.builtin.include_role:
        name: dry_run_check
      vars:
        check_content: "{{ alertmanager_config_text }}"
        check_source: null
        check_command: "{{ alertmanager_dir }}/amtool check-config %s"
      when: ansible_check_mode and not (alertmanager_download is changed)

    - name: Install the Alertmanager configuration (checked with amtool first)
      ansible.builtin.copy:
        dest: /etc/nanohpc/alertmanager/alertmanager.yml
        owner: root
        group: cluster-alertmanager
        mode: "0640"
        validate: "{{ alertmanager_dir }}/amtool check-config %s"
        content: "{{ alertmanager_config_text }}"
      register: alertmanager_config

- name: Install the Alertmanager service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-alertmanager.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Cluster alerts (nanoHPC)
      After=network-online.target nanohpc-prometheus.service
      Wants=network-online.target

      [Service]
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart={{ alertmanager_dir }}/alertmanager --config.file=/etc/nanohpc/alertmanager/alertmanager.yml \
        --storage.path=/var/lib/nanohpc/alertmanager --data.retention=8760h \
        --web.listen-address=127.0.0.1:9093 --cluster.listen-address=
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager
      MemoryMax=256M

      [Install]
      WantedBy=multi-user.target
  register: alertmanager_unit

- name: Run Alertmanager
  ansible.builtin.systemd_service:
    name: nanohpc-alertmanager
    enabled: true
    daemon_reload: "{{ alertmanager_unit.changed }}"
    state: >-
      {{ 'restarted' if (alertmanager_unit.changed or alertmanager_config.changed or slack_webhook.changed
         or slack_webhook_removed.changed) else 'started' }}
  when: not (ansible_check_mode and alertmanager_unit is changed)  # dry run: the service is not installed yet

- name: Wait until Alertmanager is ready
  ansible.builtin.uri:
    url: http://127.0.0.1:9093/-/ready
  register: alertmanager_ready
  until: alertmanager_ready.status == 200
  retries: 30
  delay: 2
  when: not ansible_check_mode  # checks this deploy's result

- name: Check that Prometheus sends its alerts to Alertmanager
  ansible.builtin.uri:
    url: http://127.0.0.1:9090/api/v1/alertmanagers
    return_content: true
  register: prometheus_alertmanagers
  until: (prometheus_alertmanagers.json.data.activeAlertmanagers | length) == 1
  retries: 15
  delay: 2
  when: not ansible_check_mode  # checks this deploy's result

# Alertmanager posts a BackupFailed/BackupOld problem once, when it starts. The weekly timer adds a
# Monday reminder of the backup problems that are still there.
- name: Install the weekly backup alert reminder
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-backup-alert-weekly"
    dest: /usr/local/bin/nanohpc-backup-alert-weekly
    owner: root
    group: root
    mode: "0755"

- name: Install the weekly backup alert reminder service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nanohpc-backup-alert-weekly.{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item == 'service' %}
      [Unit]
      Description=Remind Slack of active backup alerts (nanoHPC)
      After=network-online.target nanohpc-alertmanager.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart=/usr/local/bin/nanohpc-backup-alert-weekly --alertmanager http://127.0.0.1:9093 --prometheus http://127.0.0.1:9090 --webhook-file /etc/nanohpc/alertmanager/slack-webhook --cluster {{ nanohpc.cluster_name | quote }}
      Restart=on-failure
      RestartSec=1min
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      MemoryMax=128M
      {% else %}
      [Unit]
      Description=Remind Slack of active backup alerts each Monday (nanoHPC)

      [Timer]
      OnCalendar=Mon *-*-* 09:00:00
      Persistent=true

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: [service, timer]
  register: backup_alert_weekly_units

- name: Run the weekly backup alert reminder timer
  ansible.builtin.systemd_service:
    name: nanohpc-backup-alert-weekly.timer
    enabled: "{{ nanohpc.alerts.slack and nanohpc.backup is not none }}"
    state: "{{ 'started' if nanohpc.alerts.slack and nanohpc.backup is not none else 'stopped' }}"
    daemon_reload: "{{ backup_alert_weekly_units.changed }}"
  when: not (ansible_check_mode and backup_alert_weekly_units is changed)

- name: Install the cluster-cancel job stopper
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/cluster-cancel"
    dest: /usr/local/bin/nanohpc-cluster-cancel
    owner: root
    group: root
    mode: "0755"
  when: nanohpc.mode | default('slurm') == 'slurm'

- name: Install cluster-cancel
  ansible.builtin.copy:
    dest: /usr/local/bin/cluster-cancel
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Stop running jobs with a reason and tell each owner privately on Slack.
      exec /usr/local/bin/nanohpc-cluster-cancel --bot-token-file /etc/nanohpc/alertmanager/slack-bot-token --slack-api https://slack.com/api --scontrol /usr/bin/scontrol --scancel /usr/bin/scancel {% for user in nanohpc.users %}--user {{ (user.name ~ ':' ~ (user.slack_id | default(''))) | quote }} {% endfor %}"$@"
  when: nanohpc.mode | default('slurm') == 'slurm'

# Job-end messages: slurm.conf's MailProg is nanohpc-slack-mail. For a job that asked with --mail-user=slack,
# it queues the job's end in /var/spool/nanohpc-slack-jobs; every 30 seconds nanohpc-job-end-notify sends the
# owner a private message with the bot token. Other mail is ignored: the cluster sends no email. Without Slack
# or a bot token the queue folder is removed, so nothing is queued.
- name: Install the job-end mail program
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-slack-mail"
    dest: /usr/local/bin/nanohpc-slack-mail-queue
    owner: root
    group: root
    mode: "0755"
  when: nanohpc.mode | default('slurm') == 'slurm'

- name: Install Slurm's mail program, which queues private Slack messages
  ansible.builtin.copy:
    dest: /usr/local/bin/nanohpc-slack-mail
    owner: root
    group: root
    mode: "0755"
    content: |
      #!/bin/sh
      # Slurm's MailProg: queue job endings for private Slack messages; no email is sent.
      exec /usr/local/bin/nanohpc-slack-mail-queue --spool /var/spool/nanohpc-slack-jobs "$@"
  when: nanohpc.mode | default('slurm') == 'slurm'

- name: Create the queue where Slurm's mail program leaves ended jobs
  ansible.builtin.file:
    path: /var/spool/nanohpc-slack-jobs
    state: "{{ 'directory' if nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token | default(None) is not none and nanohpc.mode | default('slurm') == 'slurm' else 'absent' }}"
    owner: slurm
    group: cluster-alertmanager
    mode: "2770"
  when: nanohpc.mode | default('slurm') == 'slurm'

- name: Install the job-end message sender
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-job-end-notify"
    dest: /usr/local/bin/nanohpc-job-end-notify
    owner: root
    group: root
    mode: "0755"

- name: Install the job-end message service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nanohpc-job-end-notify.{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item == 'service' %}
      [Unit]
      Description=Send private Slack messages for ended jobs that asked for one (nanoHPC)
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart=/usr/local/bin/nanohpc-job-end-notify \
        --spool /var/spool/nanohpc-slack-jobs --state /var/lib/nanohpc/alertmanager/job-end.json \
        --sacct /usr/bin/sacct --bot-token-file /etc/nanohpc/alertmanager/slack-bot-token \
        --slack-api https://slack.com/api{% for user in nanohpc.users %} --user {{ user.name }}:{{ user.slack_id | default('') }}{% endfor %}{% for name in nanohpc.interactive_partitions %} --interactive-partition {{ name }}{% endfor %}
      TimeoutStartSec=2min
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager /var/spool/nanohpc-slack-jobs
      MemoryMax=128M
      {% else %}
      [Unit]
      Description=Send private Slack messages for ended jobs every 30 seconds (nanoHPC)

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=30s
      AccuracySec=5s

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: [service, timer]
  register: job_end_notify_units
  when: nanohpc.mode | default('slurm') == 'slurm'

- name: Run the job-end message timer
  ansible.builtin.systemd_service:
    name: nanohpc-job-end-notify.timer
    enabled: "{{ nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token | default(None) is not none and nanohpc.mode | default('slurm') == 'slurm' }}"
    state: "{{ 'started' if nanohpc.alerts.slack and nanohpc_secrets.slack_bot_token | default(None) is not none and nanohpc.mode | default('slurm') == 'slurm' else 'stopped' }}"
    daemon_reload: "{{ job_end_notify_units.changed }}"
  when: nanohpc.mode | default('slurm') == 'slurm' and not (ansible_check_mode and job_end_notify_units is changed)

# The user check publishes findings as Prometheus metrics. This timer sends
# channel notices through the existing Slack webhook and optional private
# messages through a bot token. It is off in monitor
# mode, where there is no Slurm user check, and whenever Slack is off.
- name: Install the user check channel notifier
  ansible.builtin.copy:
    src: "{{ nanohpc.package_files }}/nanohpc-user-check-notify"
    dest: /usr/local/bin/nanohpc-user-check-notify
    owner: root
    group: root
    mode: "0755"

- name: Install the user check channel notifier service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/nanohpc-user-check-notify.{{ item }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      {% if item == 'service' %}
      [Unit]
      Description=Post user check findings to Slack (nanoHPC)
      After=network-online.target nanohpc-prometheus.service
      Wants=network-online.target

      [Service]
      Type=oneshot
      User=cluster-alertmanager
      Group=cluster-alertmanager
      ExecStart=/usr/local/bin/nanohpc-user-check-notify \
        --prometheus http://127.0.0.1:9090 \
        --webhook-file /etc/nanohpc/alertmanager/slack-webhook \
        --state /var/lib/nanohpc/alertmanager/user-check.json --now now \
        --guide-url https://{{ nanohpc.website.hostname }}{{ nanohpc.website.path.rstrip('/') }}/#docs{% if nanohpc.mode | default('slurm') != 'monitor' %}{% for user in nanohpc.users %} --user {{ user.name }}:{{ user.slack_id | default('') }}{% endfor %}{% endif %}{% if nanohpc_secrets.slack_bot_token | default(None) %} --bot-token-file /etc/nanohpc/alertmanager/slack-bot-token{% endif %}
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      ReadWritePaths=/var/lib/nanohpc/alertmanager
      MemoryMax=128M
      {% else %}
      [Unit]
      Description=Check user findings for Slack every minute (nanoHPC)

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=1min
      AccuracySec=10s

      [Install]
      WantedBy=timers.target
      {% endif %}
  loop: [service, timer]
  register: user_check_notify_units

- name: Run the user check channel notifier timer
  ansible.builtin.systemd_service:
    name: nanohpc-user-check-notify.timer
    enabled: "{{ nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor' }}"
    state: "{{ 'started' if nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor' else 'stopped' }}"
    daemon_reload: "{{ user_check_notify_units.changed }}"
  when: not (ansible_check_mode and user_check_notify_units is changed)

- name: Check the user check channel notifier now
  ansible.builtin.systemd_service:
    name: nanohpc-user-check-notify.service
    state: started
  changed_when: false
  when: not ansible_check_mode and nanohpc.alerts.slack and nanohpc.mode | default('slurm') != 'monitor'
