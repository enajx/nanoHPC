# node_exporter on every machine. On the front node it listens on localhost only, for the local
# Prometheus. On the other machines it listens on the cluster address over mutually authenticated TLS
# and accepts only the front node's Prometheus certificate, from the front node's address.

- name: Name the download for this machine's CPU type
  ansible.builtin.set_fact:
    metrics_arch: "{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    node_exporter_dir: "/opt/nanohpc-metrics/node_exporter-{{ nanohpc.metrics.node_exporter.version }}.linux-{{ 'arm64' if ansible_facts.architecture in ['aarch64', 'arm64'] else 'amd64' }}"
    on_front: "{{ inventory_hostname in groups['role_front'] }}"

- name: Create the metrics program folder
  ansible.builtin.file:
    path: /opt/nanohpc-metrics
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download node_exporter, checking its SHA-256
  ansible.builtin.get_url:
    url: "https://github.com/prometheus/node_exporter/releases/download/v{{ nanohpc.metrics.node_exporter.version }}/node_exporter-{{ nanohpc.metrics.node_exporter.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: "/var/tmp/node_exporter-{{ nanohpc.metrics.node_exporter.version }}.linux-{{ metrics_arch }}.tar.gz"
    checksum: "sha256:{{ nanohpc.metrics.node_exporter.sha256[metrics_arch] }}"
    mode: "0644"
  register: node_exporter_download

- name: Unpack node_exporter (owned by root, whatever the archive says)
  ansible.builtin.unarchive:
    src: "/var/tmp/node_exporter-{{ nanohpc.metrics.node_exporter.version }}.linux-{{ metrics_arch }}.tar.gz"
    dest: /opt/nanohpc-metrics
    remote_src: true
    extra_opts: [--no-same-owner]
    owner: root
    group: root
    creates: "{{ node_exporter_dir }}/node_exporter"
  when: not (ansible_check_mode and node_exporter_download is changed)  # dry run: not downloaded yet

- name: Create the folder the collectors write their metrics to
  ansible.builtin.file:
    path: /var/lib/nanohpc/metrics-textfile
    state: directory
    owner: root
    group: root
    mode: "0755"

# On the front node the status collector (the monitoring role) writes the Slurm figures as its own
# account, into its own folder, so it gets no write access to the other collectors' files.
- name: Create the status collector's account on the front node
  ansible.builtin.user:
    name: cluster-monitor
    system: true
    shell: /usr/sbin/nologin
    create_home: false
  when: on_front

- name: Create the status collector's metrics folder on the front node
  ansible.builtin.file:
    path: /var/lib/nanohpc/monitor-textfile
    state: directory
    owner: cluster-monitor
    group: cluster-monitor
    mode: "0755"
  when: on_front

- name: Accept only the front node's Prometheus, over TLS 1.3
  ansible.builtin.copy:
    dest: /etc/nanohpc/metrics-tls/web.yml
    content: |
      tls_server_config:
        cert_file: /etc/nanohpc/metrics-tls/node.crt
        key_file: /etc/nanohpc/metrics-tls/node.key
        client_ca_file: /etc/nanohpc/metrics-tls/ca.crt
        client_auth_type: RequireAndVerifyClientCert
        client_allowed_sans: ['{{ nanohpc.metrics.front_address }}']
        min_version: TLS13
    owner: root
    group: cluster-node-exporter
    mode: "0640"
  register: node_exporter_web
  when: not on_front

- name: Install the node_exporter service
  ansible.builtin.copy:
    dest: /etc/systemd/system/nanohpc-node-exporter.service
    content: |
      [Unit]
      Description=Machine metrics for the cluster's Prometheus (nanoHPC)
      After=network-online.target
      Wants=network-online.target

      [Service]
      User=cluster-node-exporter
      Group=cluster-node-exporter
      ExecStart={{ node_exporter_dir }}/node_exporter \
        {% if on_front %}--web.listen-address=127.0.0.1:9100{% else %}--web.listen-address={{ nanohpc.machines[inventory_hostname].address }}:9100 --web.config.file=/etc/nanohpc/metrics-tls/web.yml{% endif %} \
        --collector.systemd --collector.systemd.unit-include=(slurmd|slurmctld|slurmdbd|munge|mariadb|nfs-server)\.service \
        --collector.textfile.directory=/var/lib/nanohpc/metrics-textfile \
        {% if on_front %}--collector.textfile.directory=/var/lib/nanohpc/monitor-textfile {% endif %}\
        --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker)($|/)
      Restart=on-failure
      RestartSec=5
      NoNewPrivileges=true
      ProtectSystem=strict
      ProtectHome=read-only
      PrivateTmp=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectControlGroups=true
      CapabilityBoundingSet=
      RestrictSUIDSGID=true
      MemoryMax=256M
      CPUQuota=25%
      {% if not on_front %}
      IPAddressDeny=any
      IPAddressAllow=localhost {{ nanohpc.metrics.front_address }} {{ nanohpc.machines[inventory_hostname].address }}
      {% endif %}

      [Install]
      WantedBy=multi-user.target
    owner: root
    group: root
    mode: "0644"
  register: node_exporter_unit

- name: Run node_exporter
  ansible.builtin.systemd_service:
    name: nanohpc-node-exporter
    enabled: true
    daemon_reload: "{{ node_exporter_unit.changed }}"
    state: >-
      {{ 'restarted' if (node_exporter_unit.changed or node_exporter_web.changed | default(false)
         or metrics_tls_changed | default(false)) else 'started' }}
  when: not (ansible_check_mode and node_exporter_unit is changed)  # dry run: the service is not installed yet

# The scrape itself (over TLS, with Prometheus's certificate) is checked by the prometheus role.
- name: Check that node_exporter listens
  ansible.builtin.command: ss -ltnH sport = :9100
  register: node_exporter_listening
  changed_when: false
  until: node_exporter_listening.stdout | trim != ''
  retries: 10
  delay: 2
  when: not ansible_check_mode  # checks this deploy's result
