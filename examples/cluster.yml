# nanoHPC cluster configuration: the whole cluster in one file.
# This example is the everyday simulated test cluster: a front node,
# four compute nodes (4 GPUs, 2 GPUs, CPU-only, 4 GPUs interactive only),
# and one storage machine that receives the backup. In the other test layout
# the storage machine serves /home instead (roles: [home]) and there is no backup.

cluster:
  name: labcluster              # shown in the website, dashboards, and Slurm
  admins: [alice]               # users with sudo and SSH access to every machine
  website:
    hostname: cluster.example.org
    https: letsencrypt          # letsencrypt | own
    # certificate: /path/on/admin/machine/cert.pem   (https: own)
    # certificate_key: /path/on/admin/machine/key.pem
    logo: null                  # optional image file
    login_address: cluster.example.org   # shown in the user guide
    path: /cluster/             # where the site is on the hostname; "/" uses the whole hostname
    allow: []                   # networks that may open the site, e.g. [10.0.0.0/8]; empty: anyone
    forwarded_by: null          # the lab web server's address, if it forwards labwebsite.com/cluster/ here
    build: package              # package: prebuilt in nanoHPC | front: built on the front node

machines:
  front:
    address: 192.168.104.10
    aliases: [cluster.example.org]   # optional extra names, written to /etc/hosts
    roles: [front, home]        # front: login, Slurm controller, monitoring, website
    home:
      device: /dev/vdb          # optional: disk for /home; without it /home stays on the root disk

  gpu4:
    address: 192.168.104.11
    roles: [compute]
    cpu: {sockets: 1, cores_per_socket: 4, threads_per_core: 2}
    memory_mb: 4096
    gpu: {type: a6000, count: 4}
    partitions: [main, interactive]
    scratch: {device: /dev/vdb}  # a spare disk for scratch

  gpu2:
    address: 192.168.104.12
    roles: [compute]
    cpu: {sockets: 1, cores_per_socket: 4, threads_per_core: 2}
    memory_mb: 4096
    gpu: {type: rtx6000ada, count: 2}
    partitions: [main]
    scratch: {image_gb: 2}     # no spare disk: scratch in a file on the root disk

  cpu1:
    address: 192.168.104.13
    roles: [compute]
    cpu: {sockets: 1, cores_per_socket: 4, threads_per_core: 1}
    memory_mb: 4096
    partitions: [main]          # no gpu: CPU-only node
    scratch: {image_gb: 2}

  gpu4i:
    address: 192.168.104.14
    roles: [compute]
    cpu: {sockets: 1, cores_per_socket: 4, threads_per_core: 2}
    memory_mb: 4096
    gpu: {type: a6000, count: 4}
    partitions: [interactive]
    scratch: {image_gb: 2}

  store:
    address: 192.168.104.20
    roles: [backup]             # storage only, runs no jobs
    backup:
      path: /srv/nanohpc-backup

users:
  - name: alice
    uid: 2000
    ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceWithYourOwnPublicKey alice@laptop"]
  - name: bob
    uid: 2001
    ssh_keys: ["ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIReplaceWithYourOwnPublicKey bob@laptop"]
    # slack_id: U123ABC          # optional private notices for lasting user-process findings

partitions:
  main:
    default: true
    jobs: batch                 # batch | interactive | any (default any)
    max_time: "24:00:00"
  interactive:
    jobs: interactive           # only the shell: srun --partition=interactive --pty bash -l
    max_time: "08:00:00"
    max_gpus_per_user: 2

policy:
  max_submit_jobs_per_user: 30
  max_gpus_per_user: unlimited
  default_cpus_per_gpu: 4
  default_memory_mb_per_cpu: 1024
  fairshare_weight: 10000       # recent GPU usage
  fairshare_half_life: "7-00:00:00"
  age_weight: 1000              # waiting time
  age_max: "7-00:00:00"

home:
  quota_soft_gb: 300
  quota_hard_gb: 400
  quota_grace: 7days

scratch:
  cleanup_days: 14
  job_retention_days: 7

backup:
  to: store                     # a machine with the backup role, or user@host:/path
  time: "03:00"
  exclude: [.cache/, .venv/, __pycache__/]

alerts:
  slack: false                  # true: the webhook is NANOHPC_SLACK_WEBHOOK in .env next to this file
                                # users with slack_id also need NANOHPC_SLACK_BOT_TOKEN in .env

user_check:
  allowed_tunnels: []           # exceptions: [{user: bob, program: cloudflared, machines: [gpu4]}]
                                # known programs: tailscale, tailscaled, cloudflared, ngrok, frpc,
                                # zrok, bore, chisel, sshuttle, autossh, code tunnel, ssh -R, ssh -w

auto_deploy:
  enabled: false                # true: the front node deploys this file's repository by itself
  repository: null              # git@github.com:lab/cluster-config.git (this cluster.yml at its root)
  branch: main                  # or for example stable or release
  every_minutes: 10             # how often the front node checks the branch
  webhook: false                # true: GitHub also calls https://<website hostname><path>deploy-hook after a push
                                #   (secret NANOHPC_DEPLOY_WEBHOOK_SECRET in .env next to this file)

nanohpc_version: null           # the nanoHPC version this cluster is deployed with, like "0.1.0"
                                #   (needed for auto_deploy: the front node installs exactly this version)
